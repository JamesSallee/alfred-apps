name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test
      - name: Offline cache bumped
        if: github.event_name == 'pull_request'
        run: node scripts/check-cache-bump.js "origin/${{ github.base_ref }}"
