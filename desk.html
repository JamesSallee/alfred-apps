<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="js/vendor/supabase-2.45.4.js"></script>
<title>The Writing Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<style>
/* Layout: each piece lives in one place. Dated posts sit in "Coming up" (top left, the next one opened out),
   undated pieces on the idea shelf (right), and "Everything" (collapsed, full width) lists the lot.
   One column on the phone: Coming up, then the capture pad. Same family as the Study. */

[hidden]{display:none!important}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 64px}
button,input,select,textarea{font:inherit;color:inherit}
:is(button,a,input,select,textarea):focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header .t{display:flex;flex-direction:column;gap:4px}
.back{color:var(--green);font-weight:600;text-decoration:none;font-size:14px}
.greet{color:var(--muted)}

.desk{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
/* One column on phones and portrait tablets, kept to a readable width. */
@media (max-width:820px){ .wrap{max-width:680px}
  .desk{grid-template-columns:minmax(0,1fr)}
  .col{display:contents}
  #comingCard{order:-3} #capture{order:-2} #bank{order:-1}
}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:19px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--green);background:transparent;color:var(--green);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.brass{border-color:var(--brass);color:var(--brass)}
.btn.quiet{border-color:var(--line);color:var(--muted)}
.muted{color:var(--muted);font-size:13px}

/* Coming up: the next post, opened out */
.nextpost{background:var(--brass-soft);border:1px solid var(--brass);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.nextpost .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.count{display:flex;flex-direction:column;align-items:flex-end;flex:none;text-align:right}
.count .big{font-family:var(--display);font-size:40px;line-height:1;color:var(--brass);font-variant-numeric:tabular-nums}
.count .sm{font-size:12px;color:var(--muted)}
.nextpost h3{font-size:22px;line-height:1.15}
.series{font-size:12px;color:var(--muted)}
.stages{display:flex;gap:4px;flex-wrap:wrap}
.stage{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.stage.done{background:var(--green-soft);border-color:transparent;color:var(--green)}
.stage.now{background:var(--brass);border-color:var(--brass);color:var(--paper);font-weight:700}
.dates{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:0}
.dates dt{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dates dd{margin:0}
.dates .late{color:var(--rust);font-weight:600}

/* Alfred's ask */
.ask{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--brass);border-radius:10px;padding:10px 12px;font-size:14px}
.ask .who{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--brass)}
.linkrow{display:flex;gap:6px;flex-wrap:wrap}
.linkrow input{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13.5px;padding:7px 10px}

/* Bank */
.bank{flex-direction:row;align-items:center;gap:12px}
.bank .light{flex:none;width:14px;height:14px;border-radius:50%;background:var(--rust);box-shadow:0 0 0 4px var(--rust-soft)}
.bank.ok .light{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.bank.half .light{background:var(--brass);box-shadow:0 0 0 4px var(--brass-soft)}
.bank .txt{display:flex;flex-direction:column;gap:2px;min-width:0}

/* Lists */
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:start}
.list li:first-child{border-top:0;padding-top:0}
.when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.list li.late .when{color:var(--rust);font-weight:600}
.list .acts{display:flex;gap:12px;align-items:baseline;white-space:nowrap}
.list .ask{margin-top:6px}
.sub{display:block;font-size:12.5px;color:var(--muted)}
.more{align-self:flex-start}

/* Everything */
details.all{gap:0}
details.all summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
details.all summary::-webkit-details-marker{display:none}
details.all summary h2::before{content:"▸ ";color:var(--muted);font-family:var(--body);font-size:14px}
details.all[open] summary h2::before{content:"▾ "}
details.all[open] summary{margin-bottom:10px}
.all input[type=search]{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;font-size:14px;margin-bottom:6px;min-width:0}
.all-list .where{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--green)}

/* Stuck */
.remedy{background:var(--green-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.remedy .src{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:3px}

/* Shelf */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.ideas{display:flex;flex-direction:column;gap:8px}
.idea{border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:4px}
.idea .meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);align-items:center}
.kind{letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.kind.ilkwim{color:var(--brass)} .kind.fiction{color:var(--green)} .kind.comedy{color:var(--rust)}
.idea .ser{color:var(--muted)}
.air{border-radius:999px;padding:0 7px;font-size:11px;white-space:nowrap;background:var(--rust-soft);color:var(--rust);text-decoration:none;font-weight:600}
.stg{border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px;white-space:nowrap}
.idea .acts{display:flex;gap:14px;flex-wrap:wrap}
.empty{font-size:13.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* Capture */
#capture textarea{width:100%;box-sizing:border-box;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px}
.saved{font-size:13px;color:var(--green);min-height:1.2em}

/* Checklist */
.check{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--green)}
.tip{border-top:1px dashed var(--line);padding-top:8px;font-size:13px;color:var(--muted)}
.tip b{color:var(--brass)}

/* Edit sheet */
.auto{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--green);background:var(--green-soft);border-radius:999px;padding:1px 6px;margin-left:4px;font-weight:700;vertical-align:1px}
.auto[hidden]{display:none}
.gathers{display:flex;flex-direction:column;gap:6px}
.gathers .g{display:flex;gap:6px;align-items:center}
.gathers .g input{flex:1;min-width:0}
.gathers .g button{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:8px;width:32px;height:32px;flex:none}
.rhythm{margin:0;font-size:12.5px;color:var(--muted)}
dialog{border:0;padding:0;background:transparent;max-width:min(480px,calc(100% - 24px));width:100%;color:var(--ink)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow:auto}
.sheet h2{font-size:20px}
.f{display:flex;flex-direction:column;gap:4px}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;font-size:14px;min-width:0}
.f textarea{min-height:64px;resize:vertical}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.tick{display:flex;gap:8px;align-items:center;font-size:14px}
.desktime{margin:0;font-size:14px}
</style>

<div class="wrap">
  <header>
    <div class="t">
      <a class="back" href="./">← Alfred's Study</a>
      <span class="eyebrow" id="date"></span>
      <h1>The Writing Desk</h1>
    </div>
    <span class="greet" id="greet"></span>
  </header>

  <div class="desk">
    <div class="col">
      <article class="card" id="comingCard" aria-labelledby="comingh"></article>
      <article class="card bank" id="bank" aria-live="polite"></article>

      <article class="card" id="stuck" aria-labelledby="stuckh">
        <div class="head"><h2 id="stuckh">Stuck?</h2><button class="btn" type="button" id="remedyBtn">Another remedy</button></div>
        <div class="remedy" id="remedy" aria-live="polite"></div>
      </article>
    </div>

    <div class="col">
      <article class="card" id="capture" aria-labelledby="caph">
        <h2 id="caph">Catch it before it goes</h2>
        <label class="label" for="capText">The idea, line or bit</label>
        <textarea id="capText" placeholder="A ranking, a story seed, a line overheard on the LIRR"></textarea>
        <div class="chips" role="group" aria-label="Where it belongs" id="capKind">
          <button class="chip" type="button" aria-pressed="true" data-k="ilkwim">ILKWIM</button>
          <button class="chip" type="button" aria-pressed="false" data-k="fiction">Fiction</button>
          <button class="chip" type="button" aria-pressed="false" data-k="comedy">Comedy</button>
        </div>
        <div class="row"><button class="btn solid" type="button" id="capSave">Put it on the shelf</button></div>
        <span class="saved" id="capSaved" aria-live="polite"></span>
      </article>

      <article class="card" aria-labelledby="shelfh">
        <div class="head"><h2 id="shelfh">The idea shelf</h2><span class="eyebrow" id="shelfCount"></span></div>
        <div class="chips" role="group" aria-label="Filter the shelf" id="shelfFilter">
          <button class="chip" type="button" aria-pressed="true" data-f="all">All</button>
          <button class="chip" type="button" aria-pressed="false" data-f="ilkwim">ILKWIM</button>
          <button class="chip" type="button" aria-pressed="false" data-f="fiction">Fiction</button>
          <button class="chip" type="button" aria-pressed="false" data-f="comedy">Comedy</button>
        </div>
        <div class="ideas" id="shelf"></div>
      </article>

      <article class="card" id="pubCard" aria-labelledby="pubh">
        <h2 id="pubh">Publish-day checklist</h2>
        <ul class="check" id="checklist"></ul>
        <p class="tip" id="tip" hidden></p>
      </article>
    </div>
  </div>

  <details class="card all" id="allCard">
    <summary><h2 id="allh">Everything</h2><span class="eyebrow" id="allCount"></span></summary>
    <input type="search" id="allSearch" placeholder="Find a piece by title, series or note" aria-label="Find a piece">
    <ul class="list all-list" id="allList"></ul>
  </details>
</div>

<dialog id="editor" aria-labelledby="edh">
  <form class="sheet" method="dialog" id="edForm">
    <h2 id="edh">Edit piece</h2>
    <div class="f"><label class="label" for="edTitle">Title</label><input id="edTitle" required></div>
    <div class="grid2">
      <div class="f"><label class="label" for="edTrack">Kind</label>
        <select id="edTrack"><option value="ilkwim">ILKWIM</option><option value="fiction">Fiction</option><option value="comedy">Comedy</option></select></div>
      <div class="f"><label class="label" for="edStage">Stage</label><select id="edStage"></select></div>
    </div>
    <div class="f" id="edSeriesF"><label class="label" for="edSeries">Series</label>
      <input id="edSeries" list="seriesList" placeholder="Stacks of Slaps, BlockWalkin', A Slight Detour, Wildcards">
      <datalist id="seriesList"><option value="Stacks of Slaps"><option value="BlockWalkin'"><option value="A Slight Detour"><option value="Wildcards"></datalist></div>
    <div class="f"><label class="label" for="edLink">Draft link (Substack or Google Docs)</label><input id="edLink" type="url" placeholder="https://"></div>
    <div id="edDates">
      <div class="grid2">
        <div class="f"><label class="label" for="edPublish">Publish on</label><input id="edPublish" type="date"></div>
        <div class="f"><label class="label" for="edDraft">Draft on <span class="auto" id="edDraftAuto">auto</span></label><input id="edDraft" type="date"></div>
        <div class="f"><label class="label" for="edDue">Schedule in Substack by <span class="auto" id="edDueAuto">auto</span></label><input id="edDue" type="date"></div>
      </div>
      <div class="f" id="edGatherF" role="group" aria-labelledby="edGatherL">
        <span class="label" id="edGatherL"><span id="edGatherLab">Gather on</span> <span class="auto" id="edGatherAuto">auto</span></span>
        <div class="gathers" id="edGathers"></div>
        <div class="row"><button class="link" type="button" id="edGatherAdd">+ Another date</button></div>
      </div>
      <p class="rhythm"><span id="edRhythmTxt"></span> <button class="link" type="button" id="edRhythm">Reset to the rhythm</button></p>
    </div>
    <label class="tick" id="edBankedF"><input type="checkbox" id="edBanked"> This is the banked post</label>
    <div class="f"><label class="label" for="edNotes">Notes</label><textarea id="edNotes"></textarea></div>
    <div class="foot">
      <button class="btn danger" type="button" id="edDelete">Delete</button>
      <div class="row"><button class="btn quiet" type="button" id="edCancel">Cancel</button><button class="btn solid" type="submit" id="edSave">Save</button></div>
    </div>
  </form>
</dialog>

<script type="module">
import { mountShell } from "./js/shell.js";
import { openStore } from "./js/sync.js";
import { writingTime, fmtMins, mirrorSoon, onAir } from "./js/rooms.js";
mountShell("desk");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

// ---------- Data ----------
// Store "desk":
//   pieces/<id>  { title, track: ilkwim|fiction|comedy, series, stage, link, publish, gather, draft, due,
//                  gathers: [dates] (every gather session; gather = the last of them),
//                  auto: { gather, draft, due } (true = follows the publish date; see rhythm()),
//                  banked, notes, checks: {i: true}, askSnooze: "YYYY-MM-DD", created }
//   settings     { remedies: [..], checklist: [..], tips: [..], greeting: ".." }
// Personal content lives in the database, never in this public file.
const store = openStore("desk");
const focusStore = openStore("focus"); // writing sessions from the Focus Room, logged against a piece
const podStore = openStore("podcast"); // the Recording Booth: which pieces are ideas or link scripts for an episode
const airTag = (p) => (onAir(podStore)[p.id] || []).map((a) =>
  `<a class="air" href="podcast.html?ep=${encodeURIComponent(a.ep)}" title="Open it in the Recording Booth">On air · ${esc(a.label)}${a.role === "link" ? " link" : ""}</a>`).join("");
const STAGES = {
  ilkwim: ["Idea", "Gather", "Draft", "Polish", "Scheduled", "Out"],
  fiction: ["Sketch", "Outline", "Draft", "Revise", "Done"],
  comedy: ["Sketch", "Outline", "Draft", "Revise", "Done"],
};
const TRACK = { ilkwim: "ILKWIM", fiction: "Fiction", comedy: "Comedy" };
const DEFAULTS = {
  remedies: [
    "Cut it in half and publish the half that's done.",
    "Ship the smallest possible thing: 300 words, one block, or a quick ranking.",
    "Rank something mundane: 5 to 10 entries, worst to best, one-line verdicts and one bracketed aside.",
    "Try another format: Dos and Don'ts, an FAQ, or a letter from Past You.",
    "Missed one? Publish the banked post and carry on. No apology opener.",
  ],
  checklist: ["A title with a hook", "End on a question", "Subscribe button midway and at the end", "Tags", "A Substack Note with one funny line"],
  tips: [],
};

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const parse = (s) => new Date(s + "T00:00");
const daysTo = (s) => Math.round((parse(s) - today0()) / 864e5);
const short = (s) => parse(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const dm = (s) => parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const settings = () => ({ ...DEFAULTS, ...(store.get("settings") || {}) });
const pieces = () => store.list("pieces/").map((x) => ({ id: x.key.slice(7), ...x.value }));
const stagesOf = (p) => STAGES[p.track] || STAGES.ilkwim;
const stageIdx = (p) => Math.max(0, stagesOf(p).indexOf(p.stage));
const isFinished = (p) => stageIdx(p) === stagesOf(p).length - 1;
const savePiece = (p) => { const { id, ...v } = p; store.set("pieces/" + id, v); mirrorSoon("desk"); };

// ---------- The rhythm (ILKWIM Writing Plan) ----------
// Posts go out on a Wednesday. Gather the weekend before (Sunday), draft on the Monday,
// schedule in Substack on the Tuesday. BlockWalkin' takes a few walks, so it gets the two Sundays before.
const isWalk = (p) => /blockwalkin/i.test(p.series || "");
function rhythm(publish, p) {
  if (!publish) return { gathers: [], draft: null, due: null };
  return {
    gathers: isWalk(p) ? [addDays(publish, -10), addDays(publish, -3)] : [addDays(publish, -3)],
    draft: addDays(publish, -2),
    due: addDays(publish, -1),
  };
}
const gathersOf = (p) => (p.gathers?.length ? [...p.gathers] : p.gather ? [p.gather] : []).sort();
/** Which dates follow the publish date. Older pieces with no record: a blank date, or one that already matches the rhythm. */
function autoOf(p) {
  if (p.auto) return { gather: !!p.auto.gather, draft: !!p.auto.draft, due: !!p.auto.due };
  const r = rhythm(p.publish, p), g = gathersOf(p);
  return {
    gather: !g.length || g.join() === r.gathers.join(),
    draft: !p.draft || p.draft === r.draft,
    due: !p.due || p.due === r.due,
  };
}
function linkKind(url) {
  if (!url) return null;
  if (/substack\.com|shadycheez/i.test(url)) return ["st", "Substack"];
  if (/docs\.google\.com/i.test(url)) return ["gd", "Docs"];
  return ["ot", "Link"];
}
function nextPost(all) {
  const t = ymd(today0());
  return all.filter((p) => p.track === "ilkwim" && p.publish && p.publish >= t && !isFinished(p) && p.stage !== "Skipped")
    .sort((a, b) => a.publish.localeCompare(b.publish))[0];
}

// ---------- Header ----------
{
  const now = new Date();
  $("date").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
}

// ---------- Render ----------
let shelfFilter = "all";
let remedyAt = Math.floor(Math.random() * 5);
let showAllComing = false;

function render() {
  const all = pieces();
  const next = nextPost(all);
  renderComing(all, next);
  renderBank(all);
  renderShelf(all);
  renderAll(all);
  renderChecklist(next);
  renderRemedy();
  renderGreeting(next, all);
}

function renderGreeting(next, all) {
  const banked = all.some((p) => p.banked && !isFinished(p));
  const g = settings().greeting;
  let line = g || "Pull up a chair.";
  if (next) {
    const d = daysTo(next.publish);
    line = d === 0 ? "Publish day. Kettle, final pass, send." : d === 1 ? "Out tomorrow. Nearly there." : d <= 7 ? `Out in ${d} days.` : `Next one's in ${d} days.`;
    if (!banked) line += d <= 7 ? " The bank is empty, but first things first." : " The bank, however, is empty.";
  }
  $("greet").textContent = line;
}

// Coming up: every dated ILKWIM post, in order. The next one is opened out; the rest are rows.
function renderComing(all, next) {
  const t = ymd(today0());
  const dated = all.filter((p) => p.track === "ilkwim" && p.publish && !isFinished(p) && p.stage !== "Skipped" && p.id !== next?.id)
    .sort((a, b) => a.publish.localeCompare(b.publish));
  const late = dated.filter((p) => p.publish < t), later = dated.filter((p) => p.publish >= t);
  const shown = showAllComing ? later : later.slice(0, 5);
  $("comingCard").innerHTML = `
    <div class="head"><h2 id="comingh">Coming up</h2><button class="link" type="button" data-new="ilkwim">Add a post</button></div>
    ${late.length ? `<ul class="list">${late.map((p) => comingRow(p, true)).join("")}</ul>` : ""}
    ${next ? nextHtml(next) : `<p class="empty">Nothing on the schedule yet. Give an idea on the shelf a date, or add a post.</p>`}
    ${shown.length ? `<ul class="list">${shown.map((p) => comingRow(p, false)).join("")}</ul>` : ""}
    ${later.length > 5 ? `<button class="link more" type="button" data-more="1">${showAllComing ? "Show fewer" : `Show all ${later.length}`}</button>` : ""}`;
}

function comingRow(p, late) {
  const mins = writingTime(focusStore, p.id).minutes;
  const sub = [p.series, p.stage, mins ? fmtMins(mins) + " written" : "", late ? "publish date has passed" : "", p.notes].filter(Boolean).join(" · ");
  const ask = !p.link && stageIdx(p) >= stagesOf(p).indexOf("Draft") && p.askSnooze !== ymd(today0());
  return `<li class="${late ? "late" : ""}"><span class="when">${esc(dm(p.publish))}</span>
    <span style="min-width:0">${esc(p.title)}<span class="sub">${esc(sub)}</span>${ask ? askHtml(p) : ""}</span>
    <span class="acts">${p.link ? `<a class="link" href="${esc(p.link)}" target="_blank" rel="noopener">Open ↗</a>` : ""}<button class="link" type="button" data-edit="${p.id}">Edit</button></span></li>`;
}

function nextHtml(p) {
  const st = stagesOf(p), i = stageIdx(p), d = daysTo(p.publish);
  const t = ymd(today0());
  const gs = gathersOf(p), gLab = isWalk(p) ? "Walk" : "Gather";
  const steps = [
    // [label, date, the stage it should have passed by then (only the last gather date can be overdue)]
    ...gs.map((g, k) => [gs.length > 1 ? `${gLab} ${k + 1} of ${gs.length}` : gLab, g, k === gs.length - 1 ? 1 : 0]),
    p.draft && ["Draft", p.draft, 2], p.due && ["Schedule in Substack", p.due, 4], ["Publish", p.publish, 5],
  ].filter(Boolean);
  const lk = linkKind(p.link);
  const askNow = !p.link && i >= st.indexOf("Draft") && p.askSnooze !== t;
  return `<div class="nextpost">
    <div class="top">
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <span class="series">Next up${p.series ? " · " + esc(p.series) : ""}</span>
        <h3 id="nexth">${esc(p.title)}</h3>
      </div>
      <div class="count"><span class="big">${d}</span><span class="sm">${d === 1 ? "day" : "days"} · ${esc(short(p.publish))}</span></div>
    </div>
    <div class="stages" role="list" aria-label="Stage">${st.map((s, k) =>
      `<span class="stage ${k < i ? "done" : k === i ? "now" : ""}" role="listitem"${k === i ? ' aria-current="step"' : ""}>${s}</span>`).join("")}</div>
    <dl class="dates">${steps.map(([lab, date, by]) => {
      const late = date < t && i < by;
      return `<dt>${esc(short(date))}</dt><dd class="${late ? "late" : ""}">${lab}${late ? " (overdue)" : ""}</dd>`;
    }).join("")}</dl>
    ${p.notes ? `<p class="muted">${esc(p.notes)}</p>` : ""}
    ${timeLine(p)}
    ${askNow ? askHtml(p) : ""}
    <div class="row">
      ${lk ? `<a class="btn solid" href="${esc(p.link)}" target="_blank" rel="noopener">Open the draft ↗</a>` : ""}
      ${i > 0 ? `<button class="btn quiet" type="button" data-back="${p.id}" aria-label="Back a stage">←</button>` : ""}
      ${i < st.length - 1 ? `<button class="btn brass" type="button" data-adv="${p.id}">Move to ${st[i + 1]}</button>` : ""}
      <button class="link" type="button" data-edit="${p.id}">Edit</button>
    </div></div>`;
}

function askHtml(p) {
  const where = p.track === "ilkwim" ? "the Substack link" : "the Doc link";
  return `<div class="ask" data-ask="${p.id}"><span class="who">Alfred</span>
    <span>${esc(p.title)} is at ${esc(p.stage)}. Got ${where}? Paste it and it goes on the desk.</span>
    <div class="linkrow"><input type="url" placeholder="Paste ${where}" aria-label="Draft link for ${esc(p.title)}" data-linkin="${p.id}">
    <button class="btn solid" type="button" data-linksave="${p.id}">Save</button>
    <button class="btn quiet" type="button" data-snooze="${p.id}">Not yet</button></div></div>`;
}

function renderBank(all) {
  const el = $("bank");
  const banked = all.filter((p) => p.banked && !isFinished(p));
  const ready = banked.find((p) => ["Polish", "Scheduled"].includes(p.stage));
  el.className = "card bank " + (ready ? "ok" : banked.length ? "half" : "");
  if (ready) el.innerHTML = `<span class="light" aria-hidden="true"></span><div class="txt"><span><b>Banked:</b> ${esc(ready.title)}.</span><span class="muted">Ready if a fortnight goes sideways.</span></div>`;
  else if (banked.length) el.innerHTML = `<span class="light" aria-hidden="true"></span><div class="txt"><span><b>Bank: in progress.</b> ${esc(banked[0].title)} is at ${esc(banked[0].stage)}.</span><span class="muted">It counts once it's polished.</span></div>`;
  else el.innerHTML = `<span class="light" aria-hidden="true"></span><div class="txt"><span><b>Bank: empty.</b></span><span class="muted">Tick "This is the banked post" on any piece to fill it.</span></div>`;
}

function renderShelf(all) {
  const shelf = all.filter((p) => !p.publish && !isFinished(p) && (shelfFilter === "all" || p.track === shelfFilter))
    .sort((a, b) => (b.created || "").localeCompare(a.created || ""));
  $("shelfCount").textContent = shelf.length + (shelf.length === 1 ? " piece" : " pieces");
  $("shelf").innerHTML = shelf.length ? shelf.map((p) => {
    const st = stagesOf(p), i = stageIdx(p);
    const kind = `${esc(TRACK[p.track])}</span>${p.series ? `<span class="ser"> · ${esc(p.series)}</span>` : ""}`;
    const acts = [];
    if (p.link) acts.push(`<a class="link" href="${esc(p.link)}" target="_blank" rel="noopener">Open ↗</a>`);
    if (i < st.length - 1) acts.push(`<button class="link" type="button" data-adv="${p.id}">Move to ${st[i + 1]}</button>`);
    if (p.track === "ilkwim") acts.push(`<button class="link" type="button" data-edit="${p.id}" data-slot="1">Give it a date</button>`);
    acts.push(`<button class="link" type="button" data-edit="${p.id}">Edit</button>`);
    const ask = !p.link && i >= st.indexOf("Draft") && p.askSnooze !== ymd(today0());
    return `<div class="idea"><div class="meta"><span><span class="kind ${p.track}">${kind}</span><span style="display:flex;gap:6px;align-items:center">${airTag(p)}<span class="stg">${esc(p.stage)}${p.banked ? " · banked" : ""}</span></span></div>
      <span>${esc(p.title)}</span>${p.notes ? `<span class="sub">${esc(p.notes)}</span>` : ""}
      ${ask ? askHtml(p) : ""}<div class="acts">${acts.join("")}</div></div>`;
  }).join("") : `<p class="empty">The shelf is clear. Catch an idea above and it lands here.</p>`;
}

// Everything: one list of every piece, saying where it lives. Collapsed unless you need it.
function whereOf(p) {
  if (p.stage === "Skipped") return "Skipped";
  if (isFinished(p)) return p.track === "ilkwim" ? "Out" : "Done";
  return p.track === "ilkwim" && p.publish ? "Coming up" : "Idea shelf";
}
function renderAll(all) {
  const q = $("allSearch").value.trim().toLowerCase();
  const rank = { "Coming up": 0, "Idea shelf": 1, "Out": 2, "Done": 2, "Skipped": 3 };
  const list = all.map((p) => ({ p, w: whereOf(p) }))
    .filter(({ p }) => !q || [p.title, p.series, p.notes, TRACK[p.track], p.stage].join(" ").toLowerCase().includes(q))
    .sort((a, b) => rank[a.w] - rank[b.w]
      || (a.w === "Coming up" ? a.p.publish.localeCompare(b.p.publish) : (b.p.publish || b.p.created || "").localeCompare(a.p.publish || a.p.created || "")));
  $("allCount").textContent = all.length + (all.length === 1 ? " piece" : " pieces");
  $("allList").innerHTML = list.length ? list.map(({ p, w }) => {
    const sub = [TRACK[p.track], p.series, w === "Out" || w === "Done" ? "" : p.stage, p.banked ? "banked" : ""].filter(Boolean).join(" · ");
    return `<li><span class="when">${p.publish ? esc(dm(p.publish)) : "–"}</span>
      <span style="min-width:0">${esc(p.title)}<span class="sub"><span class="where">${esc(w)}</span> · ${esc(sub)} ${airTag(p)}</span></span>
      <button class="link" type="button" data-edit="${p.id}">Edit</button></li>`;
  }).join("") : `<li class="empty" style="display:block">${q ? "Nothing matches that." : "No pieces yet."}</li>`;
}
$("allSearch").addEventListener("input", () => renderAll(pieces()));

function renderChecklist(next) {
  const s = settings();
  const show = next && ["Polish", "Scheduled"].includes(next.stage) || (next && daysTo(next.publish) <= 2);
  $("pubCard").hidden = !next;
  if (!next) return;
  const checks = next.checks || {};
  $("pubh").textContent = show ? `Publish-day checklist · ${next.title}` : "Publish-day checklist";
  $("checklist").innerHTML = s.checklist.map((c, i) =>
    `<li><label><input type="checkbox" data-check="${i}" ${checks[i] ? "checked" : ""}><span>${esc(c)}</span></label></li>`).join("");
  const tips = s.tips || [];
  if (tips.length) {
    const fortnight = Math.floor(today0() / (14 * 864e5));
    $("tip").innerHTML = `<b>This fortnight's tip:</b> ${esc(tips[fortnight % tips.length])}`;
    $("tip").hidden = false;
  } else $("tip").hidden = true;
}

function renderRemedy() {
  const r = settings().remedies;
  $("remedy").innerHTML = `<span class="src">From the plan</span>${esc(r[remedyAt % r.length])}`;
}

store.subscribe(render);
focusStore.subscribe(render);
function timeLine(p) {
  const w = writingTime(focusStore, p.id);
  if (!w.sessions) return `<p class="muted desktime">No Focus Room time on this one yet. Pick <b>Writing</b> there and it lands here.</p>`;
  return `<p class="desktime"><b>${fmtMins(w.minutes)}</b> at the desk over ${w.sessions} ${w.sessions === 1 ? "session" : "sessions"}<span class="muted">, last ${esc(new Date(w.last).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }))}</span></p>`;
}

// ---------- Actions ----------
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  const get = (id) => pieces().find((p) => p.id === id);
  if (t.dataset.adv) {
    const p = get(t.dataset.adv); const st = stagesOf(p); const i = stageIdx(p);
    if (i < st.length - 1) { p.stage = st[i + 1]; savePiece(p); }
  } else if (t.dataset.back) {
    const p = get(t.dataset.back); const i = stageIdx(p);
    if (i > 0) { p.stage = stagesOf(p)[i - 1]; savePiece(p); }
  } else if (t.dataset.linksave) {
    const p = get(t.dataset.linksave);
    const v = document.querySelector(`[data-linkin="${t.dataset.linksave}"]`).value.trim();
    if (!/^https?:\/\//i.test(v)) { document.querySelector(`[data-linkin="${t.dataset.linksave}"]`).focus(); return; }
    p.link = v; savePiece(p);
  } else if (t.dataset.snooze) {
    const p = get(t.dataset.snooze); p.askSnooze = ymd(today0()); savePiece(p);
  } else if (t.dataset.edit) {
    openEditor(get(t.dataset.edit), t.dataset.slot === "1");
  } else if (t.dataset.new) {
    openEditor(null);
  } else if (t.dataset.more) {
    showAllComing = !showAllComing; render();
  }
});
$("remedyBtn").addEventListener("click", () => { remedyAt++; renderRemedy(); });
$("checklist").addEventListener("change", (e) => {
  const i = e.target.dataset.check; if (i == null) return;
  const next = nextPost(pieces()); if (!next) return;
  next.checks = { ...(next.checks || {}), [i]: e.target.checked }; savePiece(next);
});
$("shelfFilter").addEventListener("click", (e) => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  shelfFilter = b.dataset.f;
  $("shelfFilter").querySelectorAll("[data-f]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
});

// Capture
let capK = "ilkwim";
$("capKind").addEventListener("click", (e) => {
  const b = e.target.closest("[data-k]"); if (!b) return;
  capK = b.dataset.k;
  $("capKind").querySelectorAll("[data-k]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
});
$("capSave").addEventListener("click", () => {
  const text = $("capText").value.trim();
  if (!text) { $("capSaved").textContent = "Type the idea first."; $("capText").focus(); return; }
  savePiece({ id: newId(), title: text, track: capK, stage: STAGES[capK][0], created: new Date().toISOString() });
  $("capText").value = "";
  $("capSaved").textContent = `On the shelf under ${TRACK[capK]}.`;
  setTimeout(() => { $("capSaved").textContent = ""; }, 4000);
});

// ---------- Editor ----------
const ed = $("editor");
let editing = null;
function fillStages(track, current) {
  $("edStage").innerHTML = STAGES[track].map((s) => `<option${s === current ? " selected" : ""}>${s}</option>`).join("");
}
function syncEditorFields() {
  const il = $("edTrack").value === "ilkwim";
  $("edSeriesF").hidden = !il; $("edDates").hidden = !il; $("edBankedF").hidden = !il;
}
function openEditor(p, focusDate = false) {
  editing = p ? { ...p } : { id: newId(), track: "ilkwim", stage: "Idea", created: new Date().toISOString() };
  $("edh").textContent = p ? "Edit piece" : "New post";
  $("edTitle").value = editing.title || "";
  $("edTrack").value = editing.track;
  fillStages(editing.track, editing.stage);
  $("edSeries").value = editing.series || "";
  $("edLink").value = editing.link || "";
  $("edPublish").value = editing.publish || "";
  editing.auto = autoOf(editing);
  editing.gathers = gathersOf(editing);
  $("edDraft").value = editing.draft || "";
  $("edDue").value = editing.due || "";
  edRefresh();
  $("edBanked").checked = !!editing.banked;
  $("edNotes").value = editing.notes || "";
  $("edDelete").hidden = !p; $("edDelete").textContent = "Delete"; delete $("edDelete").dataset.armed;
  syncEditorFields();
  ed.showModal();
  (focusDate ? $("edPublish") : $("edTitle")).focus();
}
$("edTrack").addEventListener("change", () => {
  const t = $("edTrack").value;
  const i = STAGES[editing.track].indexOf($("edStage").value);
  fillStages(t, STAGES[t][Math.min(Math.max(i, 0), STAGES[t].length - 1)]);
  syncEditorFields();
});
$("edCancel").addEventListener("click", () => ed.close());

// Dates that follow the publish date ("auto") move with it; touching one by hand pins it.
function edCurrent() { return { ...editing, series: $("edSeries").value.trim(), publish: $("edPublish").value || null }; }
function edRefresh() {
  const cur = edCurrent(), a = editing.auto, r = rhythm(cur.publish, cur);
  if (a.gather) editing.gathers = r.gathers;
  if (a.draft) $("edDraft").value = r.draft || "";
  if (a.due) $("edDue").value = r.due || "";
  const walk = isWalk(cur);
  $("edGatherLab").textContent = walk ? "Walks" : "Gather on";
  $("edGatherAdd").textContent = walk ? "+ Another walk" : "+ Another gather date";
  $("edGathers").innerHTML = editing.gathers.map((g, k) =>
    `<div class="g"><input type="date" value="${esc(g)}" data-g="${k}" aria-label="${walk ? "Walk" : "Gather date"} ${k + 1}">` +
    `<button type="button" data-gdel="${k}" aria-label="Remove this date">×</button></div>`).join("");
  $("edGatherAuto").hidden = !(a.gather && cur.publish);
  $("edDraftAuto").hidden = !(a.draft && cur.publish);
  $("edDueAuto").hidden = !(a.due && cur.publish);
  const pinned = !a.gather || !a.draft || !a.due;
  $("edRhythmTxt").textContent = !cur.publish ? "Set a publish date and the rest fill themselves in."
    : pinned ? "Dates you've changed stay put when the publish date moves." : "These follow the publish date: gather the weekend before, draft Monday, schedule Tuesday.";
  $("edRhythm").hidden = !cur.publish || !pinned;
}
$("edPublish").addEventListener("change", edRefresh);
$("edSeries").addEventListener("change", edRefresh);
$("edDraft").addEventListener("change", () => { editing.auto.draft = false; edRefresh(); });
$("edDue").addEventListener("change", () => { editing.auto.due = false; edRefresh(); });
$("edGathers").addEventListener("change", (e) => {
  const k = e.target.dataset.g; if (k == null) return;
  editing.auto.gather = false;
  if (e.target.value) editing.gathers[k] = e.target.value; else editing.gathers.splice(k, 1);
  editing.gathers.sort(); edRefresh();
});
$("edGathers").addEventListener("click", (e) => {
  const k = e.target.dataset.gdel; if (k == null) return;
  editing.auto.gather = false; editing.gathers.splice(k, 1); edRefresh();
});
$("edGatherAdd").addEventListener("click", () => {
  editing.auto.gather = false;
  const first = editing.gathers[0], pub = $("edPublish").value;
  editing.gathers.push(first ? addDays(first, -7) : pub ? addDays(pub, -3) : ymd(today0()));
  editing.gathers.sort(); edRefresh();
});
$("edRhythm").addEventListener("click", () => { editing.auto = { gather: true, draft: true, due: true }; edRefresh(); });
$("edForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const title = $("edTitle").value.trim(); if (!title) { $("edTitle").focus(); return; }
  const il = $("edTrack").value === "ilkwim";
  const link = $("edLink").value.trim();
  const p = { ...editing, title, track: $("edTrack").value, stage: $("edStage").value, link: link || null,
    series: il ? $("edSeries").value.trim() || null : null,
    publish: il ? $("edPublish").value || null : null,
    gathers: il ? [...editing.gathers].sort() : [], gather: il ? [...editing.gathers].sort().pop() || null : null,
    auto: editing.auto,
    draft: il ? $("edDraft").value || null : null, due: il ? $("edDue").value || null : null,
    banked: il && $("edBanked").checked, notes: $("edNotes").value.trim() || null };
  if (p.banked) pieces().filter((x) => x.banked && x.id !== p.id).forEach((x) => { x.banked = false; savePiece(x); });
  savePiece(p);
  ed.close();
});
$("edDelete").addEventListener("click", () => {
  const b = $("edDelete");
  if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again to delete"; return; }
  store.remove("pieces/" + editing.id); mirrorSoon("desk");
  ed.close();
});
</script>
</html>
