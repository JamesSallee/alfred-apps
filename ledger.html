<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="js/vendor/supabase-2.45.4.js"></script>
<title>Alfred's Daily Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, like a pocket ledger. Balance up top, the day's list, then store and habits behind tabs. */
:root{
  --bg:#eef1ec; --paper:#f8faf6; --ink:#1d2b24; --muted:#5d6b63; --line:#d3dbd4;
  --green:#1f4d3a; --green-soft:#dce8e0; --brass:#a87a1f; --brass-soft:#f3e7c8;
  --done:#1f4d3a; --done-ink:#f4f7f2; --danger:#9b3b2e;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a16; --paper:#18241f; --ink:#e6ece7; --muted:#9aa9a0; --line:#2b3a33;
  --green:#7fbf9d; --green-soft:#21352c; --brass:#d9ad55; --brass-soft:#3a3020;
  --done:#2f6b51; --done-ink:#f4f7f2; --danger:#e08a7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a16; --paper:#18241f; --ink:#e6ece7; --muted:#9aa9a0; --line:#2b3a33;
  --green:#7fbf9d; --green-soft:#21352c; --brass:#d9ad55; --brass-soft:#3a3020;
  --done:#2f6b51; --done-ink:#f4f7f2; --danger:#e08a7b; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px}
.back{display:inline-block;font-size:13px;font-weight:600;color:var(--green);text-decoration:none;margin-bottom:4px}
.back:hover{text-decoration:underline}
.back:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.purse{text-align:right}
.purse .amt{font-family:var(--display);font-size:34px;line-height:1;color:var(--brass)}
.purse .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

nav.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--green-soft);color:var(--green)}

.week{display:flex;align-items:center;gap:6px}
.week .arrow{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:32px;height:44px;flex:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1;min-width:0}
.day{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .dn{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .dd{font-weight:600}
.day .dot{width:18px;height:3px;border-radius:2px;background:var(--line)}
.day.sel{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.day.today .dd{color:var(--brass)}
.day[disabled]{opacity:.4;cursor:default}
.day.rest .dot{background:var(--muted)}

.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayhead h2{font-size:20px}
.dayhead .pts{color:var(--muted);font-size:13px}
.restbtn{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.restbtn[aria-pressed="true"]{border-style:solid;border-color:var(--muted);color:var(--ink);background:var(--paper)}
.sunday{display:flex;flex-direction:column;gap:6px;background:var(--brass-soft);border:1px solid var(--brass);border-radius:14px;padding:12px 14px;color:var(--ink);text-decoration:none;font-size:14px}
.sunday b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--brass)}
.sunday .go{font-weight:700;color:var(--brass)}
.sunday:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.restnote{font-size:13px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px}

.list{display:flex;flex-direction:column;gap:8px}
.habit{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.habit .tick{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700}
.habit .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.habit .name{font-weight:600}
.habit .info{font-size:12.5px;color:var(--muted)}
.habit .pv{font-weight:700;color:var(--brass);font-size:14px}
.habit.on{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.habit.on .tick{border-color:var(--done-ink);background:var(--done-ink);color:var(--done)}
.habit.on .info{color:var(--done-ink);opacity:.8}
.habit.on .pv{color:var(--done-ink)}
.habit .right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.habit .sk{font-family:var(--display);font-size:20px;line-height:1;color:var(--green)}
.habit .sk small{font-family:var(--body);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:3px}
.habit.on .sk,.habit.on .sk small{color:var(--done-ink)}
.streaks{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:14px;align-items:baseline}
.streaks .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.streaks .c{font-family:var(--display);font-size:17px;color:var(--green);text-align:right}
.streaks .b{color:var(--muted);text-align:right}
.variants{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 4px 54px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--paper)}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:17px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.mix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mix div{display:flex;flex-direction:column;gap:4px;font-size:13px}
.mix b{font-family:var(--display);font-weight:400;font-size:18px}
.small{font-size:12.5px;color:var(--muted)}

.item{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.item .meta{flex:1;min-width:0}
.item .name{font-weight:600}
.item .cost{font-family:var(--display);color:var(--brass);font-size:18px;white-space:nowrap}
.btn{border:1px solid var(--green);background:var(--green);color:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--green)}
.btn.warn{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 9px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

form.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.edit .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.02em;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;box-sizing:border-box}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.hist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.empty{color:var(--muted);text-align:center;padding:24px 12px;border:1px dashed var(--line);border-radius:14px}

.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.toast div{max-width:520px;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-size:14px;box-shadow:0 6px 24px rgb(0 0 0 / .18);
  opacity:0;transform:translateY(8px);transition:opacity .25s, transform .25s}
.toast.show div{opacity:1;transform:none}
.toast .who{font-family:var(--display);color:var(--brass);margin-right:6px}
.status{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.toast div{transition:none}}
@media (max-width:420px){form.edit{grid-template-columns:1fr}.variants{padding-left:0}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <a class="back" href="./">← Alfred's Study</a>
      <h1>The Daily Ledger</h1>
      <div class="sub" id="greet">Kept by Alfred</div>
    </div>
    <div class="purse"><div class="amt num" id="balance">0</div><div class="lbl">points to spend</div></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-today" aria-selected="true" data-view="today">Today</button>
    <button role="tab" id="tab-store" aria-selected="false" data-view="store">Store</button>
    <button role="tab" id="tab-habits" aria-selected="false" data-view="habits">Habits</button>
  </nav>

  <div class="status" id="status" hidden></div>

  <section id="v-today" class="wrap" style="gap:14px"></section>
  <section id="v-store" class="wrap" style="gap:14px" hidden></section>
  <section id="v-habits" class="wrap" style="gap:14px" hidden></section>
</div>
<div class="toast" id="toast" aria-live="polite"><div></div></div>

<script type="module">
import { mountShell } from "./js/shell.js";
import { openDb } from "./js/compat-db.js";
import { linkWorkoutsToLedger, linkWritingToLedger, fetchPelotonIfStale } from "./js/rooms.js";
mountShell('ledger');
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const monday = s => { const d = parse(s); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); };
const DN = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const fmtLong = s => parse(s).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = s => parse(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"});

// Streak milestones and their bonus points
const MILESTONES = [[3,5],[7,15],[14,30],[30,75]];
const bonusFor = n => { for (const [m,b] of MILESTONES) if (n===m) return b; return (n>30 && n%30===0) ? 75 : 0; };
const nextMilestone = n => { for (const [m] of MILESTONES) if (n<m) return m; return Math.ceil((n+1)/30)*30; };

const LINES = {
  done: ["Noted. Carry on.","Very good. I shall record it with quiet satisfaction.","Done, and without fuss. My favourite kind.","Splendid. The ledger approves.","Another one in the book.","I'll pretend I'm not impressed.","Well kept, sir.","That counts. Everything counts."],
  piano: ["Ten minutes is still music.","The neighbours will thank you. Eventually.","An attempt is all I ask."],
  workout: ["The Peloton forgives you.","Changed and showered, I trust.","Your future knees send their regards."],
  write: ["The page is less blank than it was.","Words on paper. The rest is editing."],
  "walk-mara": ["Walk done. Somebody is delighted."],
  "bed-by-11": ["Bed before eleven. Practically heroic."],
  tidy: ["Ten minutes of order. The house exhales."],
  journal: ["Written down, and therefore real."],
  undo: ["Struck from the record. No harm done.","Unticked. We shan't speak of it."],
  spend: ["Enjoy it. You earned it, which is rather the point.","Purchased. I'll look the other way.","Treat dispensed. Do enjoy it properly."],
  rest: ["A rest day. Streaks will wait patiently.","Rest noted. Nothing is lost by it."]
};
const pick = a => a[Math.floor(Math.random()*a.length)];
let toastTimer;
function say(text){ const t=$("#toast"); t.firstElementChild.innerHTML='<span class="who">Alfred</span>'+esc(text); t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3200); }

// State
const S = { habits:[], days:{}, store:[], spends:[], settings:{streakMode:"grace"}, loaded:{}, view:"today", sel:ymd(new Date()), weekStart:monday(ymd(new Date())), editing:null, confirm:null, addingItem:false, addingHabit:false };
let db = null;
const today = () => ymd(new Date());

// One write at a time per document
const queues = {};
function write(path, fn){ queues[path] = (queues[path]||Promise.resolve()).then(fn).catch(e => { say(e && e.code==="quota_exceeded" ? "The ledger is full. Remove a few old entries." : "That didn't save. Check your connection and try again."); }); return queues[path]; }

// Points engine: everything derives from the day log, so it can always be recomputed.
function compute(){
  const t = today();
  const active = S.habits;
  const dates = Object.keys(S.days).sort();
  const first = dates[0] && dates[0] < t ? dates[0] : t;
  const res = { earned:0, byDate:{}, streak:{}, best:{}, week:{}, bonuses:[] };
  const addPts = (d,n) => { res.earned += n; res.byDate[d] = (res.byDate[d]||0)+n; };
  const mode = S.settings.streakMode || "grace";
  for (const h of active){
    let streak=0, best=0, graceWeek=null; const weekCount={}; const weekPaid={};
    const start = h.created && h.created > first ? h.created : first;
    for (let d=start; d<=t; d=addDays(d,1)){
      const rec = S.days[d]; const done = rec && rec.done && rec.done[h.id];
      const wk = monday(d);
      if (done){
        addPts(d, Number(h.points)||0);
        weekCount[wk]=(weekCount[wk]||0)+1;
        const target = Number(h.weeklyTarget)||0;
        if ((h.kind==="weekly" || mode==="weekly") && target && weekCount[wk]===target && !weekPaid[wk]){
          weekPaid[wk]=true; const b = h.kind==="weekly" ? (Number(h.points)||0) : (Number(h.points)||0)*2;
          addPts(d,b); res.bonuses.push({date:d,habit:h.name,amount:b,why:"weekly target met"});
        }
        if (h.kind!=="weekly" && mode!=="weekly"){
          streak++; if (streak>best) best=streak; const b = bonusFor(streak);
          if (b){ addPts(d,b); res.bonuses.push({date:d,habit:h.name,amount:b,why:streak+"-day streak"}); }
        }
      } else if (h.kind!=="weekly" && mode!=="weekly" && d!==t && !(rec && rec.rest)){
        if (mode==="grace" && graceWeek!==wk){ graceWeek=wk; } else { streak=0; }
      }
    }
    res.streak[h.id]=streak; res.best[h.id]=best;
    res.week[h.id]=weekCount[monday(S.sel)]||0;
  }
  res.spent = S.spends.reduce((a,s)=>a+(Number(s.cost)||0),0);
  res.balance = res.earned - res.spent;
  return res;
}

function workoutMix(weekStart){
  const mix = {}; for (let i=0;i<7;i++){ const r=S.days[addDays(weekStart,i)]; const v=r&&r.done&&r.done.workout; if (typeof v==="string") mix[v]=(mix[v]||0)+1; }
  return mix;
}

// Rendering
function render(){
  const R = compute();
  $("#balance").textContent = R.balance;
  const h = new Date().getHours();
  $("#greet").textContent = (h<12?"Good morning":h<18?"Good afternoon":"Good evening")+", James. Kept by Alfred.";
  for (const b of document.querySelectorAll("nav.tabs button")) b.setAttribute("aria-selected", b.dataset.view===S.view);
  for (const v of ["today","store","habits"]) $("#v-"+v).hidden = S.view!==v;
  if (S.view==="today") renderToday(R);
  if (S.view==="store") renderStore(R);
  if (S.view==="habits") renderHabits(R);
}

function renderToday(R){
  const t = today(), sel = S.sel, rec = S.days[sel]||{}, isRest = !!rec.rest;
  let strip = "";
  for (let i=0;i<7;i++){
    const d = addDays(S.weekStart,i); const r = S.days[d]; const n = r&&r.done?Object.keys(r.done).length:0;
    const total = S.habits.filter(x=>x.kind!=="weekly").length||1;
    const pct = Math.min(100, Math.round(n/total*100));
    strip += `<button class="day${d===sel?" sel":""}${d===t?" today":""}${r&&r.rest?" rest":""}" data-day="${d}" ${d>t?"disabled":""} aria-label="${fmtLong(d)}">
      <span class="dn">${DN[i]}</span><span class="dd num">${parse(d).getDate()}</span>
      <span class="dot" style="background:${n?`linear-gradient(90deg,var(--green) ${pct}%,var(--line) ${pct}%)`:""}"></span></button>`;
  }
  const nextWeekDisabled = addDays(S.weekStart,7) > t;
  let html = `<div class="week"><button class="arrow" id="prevWeek" aria-label="Previous week">‹</button><div class="days">${strip}</div><button class="arrow" id="nextWeek" aria-label="Next week" ${nextWeekDisabled?"disabled":""}>›</button></div>`;
  const dayPts = R.byDate[sel]||0;
  html += `<div class="dayhead"><h2>${sel===t?"Today":esc(fmtLong(sel))}</h2><span class="pts num">${dayPts} points ${sel===t?"so far":"earned"}</span>
    <button class="restbtn" id="restBtn" aria-pressed="${isRest}">${isRest?"Rest day ✓":"Mark as rest day"}</button></div>`;
  if (sel===t && parse(t).getDay()===0) html += `<a class="sunday" href="shutdown.html"><span><b>It's Sunday.</b> Time for the shutdown: close out the week and set up the next.</span><span class="go">Open Sunday Shutdown →</span></a>`;
  if (isRest) html += `<div class="restnote">Rest day. Streaks are paused, so nothing is lost. Anything you do still earns points.</div>`;
  if (!S.loaded.habits){ html += `<div class="empty">Opening the ledger…</div>`; $("#v-today").innerHTML = html; bindToday(); return; }
  if (!S.habits.length){ html += `<div class="empty">No habits yet. Add your first one under Habits.</div>`; }
  const daily = S.habits.filter(x=>x.kind!=="weekly"), weekly = S.habits.filter(x=>x.kind==="weekly");
  const row = hb => {
    const v = rec.done && rec.done[hb.id]; const on = !!v;
    const st = R.streak[hb.id]||0; const mode = S.settings.streakMode;
    let info = "";
    if (hb.kind==="weekly") info = `${R.week[hb.id]} of ${hb.weeklyTarget||1} this week`;
    else if (mode==="weekly") info = `${R.week[hb.id]} of ${hb.weeklyTarget||5} days this week`;
    else info = st ? `Streak ${st} · next bonus at ${nextMilestone(st)}` : (hb.note ? esc(hb.note) : "Any attempt counts");
    if (hb.variants && typeof v==="string"){ const vv = hb.variants.find(x=>x.key===v); if (vv) info = vv.label+" · "+info; }
    if (hb.minutes && typeof v==="number") info = v+" min · "+info;
    let out = `<button class="habit${on?" on":""}" data-habit="${esc(hb.id)}" aria-pressed="${on}">
      <span class="tick">${on?"✓":""}</span>
      <span class="meta"><span class="name">${esc(hb.name)}</span><span class="info">${info}</span></span>
      <span class="right">${hb.kind!=="weekly" && mode!=="weekly" && st>0 ? `<span class="sk num" aria-label="${st}-day streak">${st}<small>day${st===1?"":"s"}</small></span>` : ""}<span class="pv num">+${Number(hb.points)||0}</span></span></button>`;
    if (hb.variants && hb.variants.length && S.choosing===hb.id){
      out += `<div class="variants">${hb.variants.map(x=>`<button class="chip" data-variant="${esc(x.key)}" data-for="${esc(hb.id)}" aria-pressed="${v===x.key}">${esc(x.label)}</button>`).join("")}</div>`;
    }
    if (hb.minutes && hb.minutes.length && S.choosing===hb.id){
      out += `<div class="variants">${hb.minutes.map(m=>`<button class="chip" data-min="${Number(m)}" data-for="${esc(hb.id)}">${Number(m)} min</button>`).join("")}
        <span class="row" style="gap:6px"><input id="minIn" type="number" min="1" max="600" step="1" inputmode="numeric" placeholder="Other" aria-label="Minutes" style="width:84px;padding:6px 10px"><button class="chip" data-minlog data-for="${esc(hb.id)}">Log</button></span></div>`;
    }
    return out;
  };
  html += `<div class="list">${daily.map(row).join("")}</div>`;
  if (weekly.length) html += `<h3 style="font-size:16px;margin-top:4px">This week</h3><div class="list">${weekly.map(row).join("")}</div>`;
  // Week summary
  const wk = monday(sel); let wkPts=0; for (let i=0;i<7;i++) wkPts += R.byDate[addDays(wk,i)]||0;
  const wo = S.habits.find(x=>x.id==="workout" && x.variants);
  let mixHtml = "";
  if (wo){
    const mix = workoutMix(wk);
    mixHtml = `<div class="mix">${wo.variants.map(x=>{ const n=mix[x.key]||0, tg=x.target||1; return `<div><span class="small">${esc(x.label)}</span><b class="num">${n} / ${tg}</b><span class="bar"><i style="width:${Math.min(100,n/tg*100)}%"></i></span></div>`; }).join("")}</div>`;
  }
  const recent = R.bonuses.filter(b=>b.date>=wk && b.date<=addDays(wk,6));
  html += `<div class="panel"><h3>Week of ${esc(fmtShort(wk))}</h3>
    <div class="kv"><span>Points this week</span><span class="num">${wkPts}</span></div>
    ${mixHtml}
    ${S.habits.filter(x=>x.minutes).map(x=>{ let m=0; for (let i=0;i<7;i++){ const r=S.days[addDays(wk,i)]; const val=r&&r.done&&r.done[x.id]; if (typeof val==="number") m+=val; } return `<div class="kv"><span>${esc(x.name)} this week</span><span class="num">${m} min</span></div>`; }).join("")}
    ${recent.length?`<div class="small">Bonuses: ${recent.map(b=>`${esc(b.habit)} ${esc(b.why)} (+${b.amount})`).join("; ")}</div>`:""}
  </div>`;
  if (S.settings.streakMode!=="weekly" && daily.length){
    html += `<div class="panel"><h3>Streaks</h3><div class="streaks"><span class="h">Habit</span><span class="h" style="text-align:right">Now</span><span class="h" style="text-align:right">Best</span>
      ${daily.map(hb=>{ const st=R.streak[hb.id]||0, bs=R.best[hb.id]||0; return `<span>${esc(hb.name)}</span><span class="c num">${st}</span><span class="b num">${bs}</span>`; }).join("")}</div>
      <div class="small">Days in a row, with one grace day a week. Rest days pause the count.</div></div>`;
  }
  $("#v-today").innerHTML = html; bindToday();
}

function bindToday(){
  const v = $("#v-today");
  v.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ S.sel=b.dataset.day; S.choosing=null; render(); });
  const p=$("#prevWeek"), n=$("#nextWeek");
  if (p) p.onclick=()=>{ S.weekStart=addDays(S.weekStart,-7); S.sel=addDays(S.weekStart,6); render(); };
  if (n) n.onclick=()=>{ S.weekStart=addDays(S.weekStart,7); const e=addDays(S.weekStart,6); S.sel = e>today()?today():e; render(); };
  const rb=$("#restBtn"); if (rb) rb.onclick=toggleRest;
  v.querySelectorAll("[data-habit]").forEach(b=>b.onclick=()=>tapHabit(b.dataset.habit));
  v.querySelectorAll("[data-variant]").forEach(b=>b.onclick=()=>setDone(b.dataset.for, b.dataset.variant));
  v.querySelectorAll("[data-min]").forEach(b=>b.onclick=()=>setDone(b.dataset.for, Number(b.dataset.min)));
  const mi=$("#minIn"), ml=v.querySelector("[data-minlog]");
  if (mi && ml){
    const log=()=>{ const n=Math.round(Number(mi.value)); if (!n || n<1) { mi.focus(); return say("How many minutes? Any number will do."); } setDone(ml.dataset.for, Math.min(600,n)); };
    ml.onclick=log; mi.onkeydown=e=>{ if (e.key==="Enter"){ e.preventDefault(); log(); } };
  }
}

function dayDoc(d){ const r = S.days[d]||{}; return { done:{...(r.done||{})}, rest:!!r.rest }; }
function saveDay(d, body){
  S.days[d] = body; render();
  if (!db) return;
  write("days/"+d, ()=> db.doc("days/"+d).set(body));
}
function tapHabit(id){
  const hb = S.habits.find(x=>x.id===id); if (!hb) return;
  const cur = (S.days[S.sel]||{}).done?.[id];
  if ((hb.variants && hb.variants.length) || (hb.minutes && hb.minutes.length)){
    if (cur){ S.choosing=null; return setDone(id, null); }
    S.choosing = S.choosing===id ? null : id; return render();
  }
  setDone(id, cur ? null : true);
}
function setDone(id, val){
  const before = compute();
  const body = dayDoc(S.sel);
  if (val==null || body.done[id]===val) { delete body.done[id]; S.choosing=null; saveDay(S.sel, body); return say(pick(LINES.undo)); }
  body.done[id] = val; S.choosing=null; saveDay(S.sel, body);
  const after = compute();
  const hb = S.habits.find(x=>x.id===id);
  const gained = after.earned - before.earned, base = Number(hb.points)||0;
  if (gained > base) say(`Bonus! ${gained-base} extra points for keeping it up. I've added them to your purse.`);
  else say(pick([...(LINES[id]||[]), ...LINES.done]));
}
function toggleRest(){ const body = dayDoc(S.sel); body.rest = !body.rest; saveDay(S.sel, body); if (body.rest) say(pick(LINES.rest)); }

function renderStore(R){
  let html = `<div class="panel"><div class="kv"><span>Earned to date</span><span class="num">${R.earned}</span></div><div class="kv"><span>Spent</span><span class="num">${R.spent}</span></div></div>`;
  if (!S.store.length) html += `<div class="empty">The store is empty. Add a treat you'd actually look forward to.</div>`;
  html += `<div class="list">`;
  for (const it of [...S.store].sort((a,b)=>(a.cost||0)-(b.cost||0))){
    const short = (it.cost||0) - R.balance;
    const confirming = S.confirm && S.confirm.type==="buy" && S.confirm.id===it.id;
    const delConfirm = S.confirm && S.confirm.type==="delItem" && S.confirm.id===it.id;
    html += `<div class="item"><div class="meta"><div class="name">${esc(it.name)}</div><div class="small">${it.note?esc(it.note)+" · ":""}${short>0?`${short} more to go`:"Yours whenever you like"}</div>
      ${confirming?`<div class="confirm" style="margin-top:6px"><span>Spend ${it.cost} points?</span><button class="btn" data-buy="${esc(it.id)}">Yes, treat me</button><button class="btn ghost" data-cancel>Not yet</button></div>`:""}
      ${delConfirm?`<div class="confirm" style="margin-top:6px"><span>Remove this treat?</span><button class="btn warn" data-delitem="${esc(it.id)}">Remove</button><button class="btn ghost" data-cancel>Keep</button></div>`:""}
      </div><div class="cost num">${it.cost}</div>
      <div class="row" style="flex-direction:column;gap:6px"><button class="btn" data-ask="${esc(it.id)}" ${short>0?"disabled":""}>Redeem</button><button class="iconbtn" data-askdel="${esc(it.id)}" aria-label="Remove ${esc(it.name)}">Remove</button></div></div>`;
  }
  html += `</div>`;
  html += S.addingItem ? `<form class="panel edit" id="itemForm"><label class="f full">Treat<input id="itemName" required maxlength="60" placeholder="e.g. Afternoon at the bookshop"></label>
      <label class="f">Cost in points<input id="itemCost" type="number" min="1" step="1" required value="100"></label>
      <label class="f">Note (optional)<input id="itemNote" maxlength="60"></label>
      <div class="row full"><button class="btn" type="submit">Add to store</button><button class="btn ghost" type="button" data-cancelitem>Cancel</button></div></form>`
    : `<button class="btn ghost" id="addItem">Add a treat</button>`;
  const recent = [...S.spends].sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,10);
  if (recent.length) html += `<div class="panel"><h3>Recently enjoyed</h3><div class="hist">${recent.map(s=>`<div><span>${esc(s.name)} <span class="small">${esc(fmtShort(String(s.at).slice(0,10)))}</span></span><span class="row"><span class="num">−${s.cost}</span><button class="iconbtn" data-undo="${esc(s.id)}">Undo</button></span></div>`).join("")}</div></div>`;
  $("#v-store").innerHTML = html;
  const v=$("#v-store");
  v.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>{ S.confirm={type:"buy",id:b.dataset.ask}; render(); });
  v.querySelectorAll("[data-askdel]").forEach(b=>b.onclick=()=>{ S.confirm={type:"delItem",id:b.dataset.askdel}; render(); });
  v.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{ S.confirm=null; render(); });
  v.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));
  v.querySelectorAll("[data-delitem]").forEach(b=>b.onclick=()=>{ const id=b.dataset.delitem; S.store=S.store.filter(x=>x.id!==id); S.confirm=null; render(); if (db) write("store/"+id,()=>db.doc("store/"+id).delete()); });
  v.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{ const id=b.dataset.undo; S.spends=S.spends.filter(x=>x.id!==id); render(); say("Refunded. The treat never happened."); if (db) write("spends/"+id,()=>db.doc("spends/"+id).delete()); });
  const a=$("#addItem"); if (a) a.onclick=()=>{ S.addingItem=true; render(); $("#itemName")?.focus(); };
  const c=v.querySelector("[data-cancelitem]"); if (c) c.onclick=()=>{ S.addingItem=false; render(); };
  const f=$("#itemForm"); if (f) f.onsubmit=e=>{ e.preventDefault(); const name=$("#itemName").value.trim(); const cost=Math.max(1,Math.round(Number($("#itemCost").value)||0)); if(!name) return;
    const id="t"+Date.now().toString(36); const body={name,cost,note:$("#itemNote").value.trim()}; S.store.push({id,...body}); S.addingItem=false; render(); say("On the shelf. Something to look forward to.");
    if (db) write("store/"+id,()=>db.doc("store/"+id).set(body)); };
}
function buy(id){
  const it=S.store.find(x=>x.id===id); if(!it) return; const R=compute(); if (R.balance < it.cost) return;
  const sid="s"+Date.now().toString(36); const body={itemId:id,name:it.name,cost:it.cost,at:new Date().toISOString()};
  S.spends.push({id:sid,...body}); S.confirm=null; render(); say(pick(LINES.spend));
  if (db) write("spends/"+sid,()=>db.doc("spends/"+sid).set(body));
}

function habitForm(h){
  const isWo = h && h.variants;
  return `<form class="panel edit" id="habitForm" data-id="${h?esc(h.id):""}">
    <label class="f full">Habit<input id="hName" required maxlength="50" value="${h?esc(h.name):""}" placeholder="e.g. Read for twenty minutes"></label>
    <label class="f">Points each time<input id="hPoints" type="number" min="0" step="1" required value="${h?Number(h.points)||0:5}"></label>
    <label class="f">How often<select id="hKind"><option value="daily" ${!h||h.kind!=="weekly"?"selected":""}>Daily</option><option value="weekly" ${h&&h.kind==="weekly"?"selected":""}>A few times a week</option></select></label>
    <label class="f">Weekly target (days)<input id="hTarget" type="number" min="1" max="7" step="1" value="${h?Number(h.weeklyTarget)||5:5}"></label>
    <label class="f">Note (optional)<input id="hNote" maxlength="60" value="${h?esc(h.note||""):""}"></label>
    ${isWo?`<div class="small full">Workout types and weekly mix: ${h.variants.map(v=>esc(v.label)+" "+v.target).join(", ")}.</div>`:""}
    <div class="row full"><button class="btn" type="submit">${h?"Save":"Add habit"}</button><button class="btn ghost" type="button" data-cancelhabit>Cancel</button></div></form>`;
}
function renderHabits(R){
  let html = `<div class="panel"><h3>How streaks work</h3>
    <label class="f">Streak style<select id="streakMode">
      <option value="grace" ${S.settings.streakMode==="grace"?"selected":""}>Bonuses with one grace day a week</option>
      <option value="classic" ${S.settings.streakMode==="classic"?"selected":""}>Classic: a missed day resets</option>
      <option value="weekly" ${S.settings.streakMode==="weekly"?"selected":""}>Weekly targets instead of streaks</option></select></label>
    <div class="small">${S.settings.streakMode==="weekly"?"Hit a habit's weekly target and earn double its points as a bonus.":"Bonus points at 3, 7, 14 and 30 days, then every 30. Rest days pause streaks. Breaking a streak never costs points you've earned."}</div></div>`;
  html += `<div class="list">`;
  S.habits.forEach((h,i)=>{
    if (S.editing===h.id){ html += habitForm(h); return; }
    const del = S.confirm && S.confirm.type==="archive" && S.confirm.id===h.id;
    html += `<div class="item"><div class="meta"><div class="name">${esc(h.name)}</div><div class="small">${Number(h.points)||0} points · ${h.kind==="weekly"?`${h.weeklyTarget||1} a week`:"daily"}${h.note?" · "+esc(h.note):""}</div>
      ${del?`<div class="confirm" style="margin-top:6px"><span>Retire this habit? Past points stay.</span><button class="btn warn" data-archive="${esc(h.id)}">Retire</button><button class="btn ghost" data-cancel>Keep</button></div>`:""}</div>
      <div class="row"><button class="iconbtn" data-up="${i}" ${i===0?"disabled":""} aria-label="Move up">↑</button><button class="iconbtn" data-edit="${esc(h.id)}">Edit</button><button class="iconbtn" data-askarch="${esc(h.id)}">Retire</button></div></div>`;
  });
  html += `</div>`;
  html += S.addingHabit ? habitForm(null) : `<button class="btn ghost" id="addHabit">Add a habit</button>`;
  if (S.retired.length) html += `<div class="panel"><h3>Retired</h3><div class="hist">${S.retired.map(h=>`<div><span>${esc(h.name)}</span><button class="iconbtn" data-restore="${esc(h.id)}">Bring back</button></div>`).join("")}</div></div>`;
  $("#v-habits").innerHTML = html;
  const v=$("#v-habits");
  $("#streakMode").onchange=e=>{ S.settings={...S.settings,streakMode:e.target.value}; render(); if (db) write("settings/main",()=>db.doc("settings/main").set(S.settings)); };
  v.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ S.editing=b.dataset.edit; S.addingHabit=false; render(); });
  v.querySelectorAll("[data-askarch]").forEach(b=>b.onclick=()=>{ S.confirm={type:"archive",id:b.dataset.askarch}; render(); });
  v.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{ S.confirm=null; render(); });
  v.querySelectorAll("[data-archive]").forEach(b=>b.onclick=()=>saveHabit(b.dataset.archive,{active:false}));
  v.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>saveHabit(b.dataset.restore,{active:true}));
  v.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; const a=S.habits[i-1], c=S.habits[i]; const oa=a.order??i-1, oc=c.order??i; saveHabit(a.id,{order:oc===oa?oa+1:oc}); saveHabit(c.id,{order:oa}); });
  const add=$("#addHabit"); if (add) add.onclick=()=>{ S.addingHabit=true; S.editing=null; render(); $("#hName")?.focus(); };
  const c=v.querySelector("[data-cancelhabit]"); if (c) c.onclick=()=>{ S.addingHabit=false; S.editing=null; render(); };
  const f=$("#habitForm"); if (f) f.onsubmit=e=>{ e.preventDefault(); const name=$("#hName").value.trim(); if(!name) return;
    const patch={name,points:Math.max(0,Math.round(Number($("#hPoints").value)||0)),kind:$("#hKind").value,weeklyTarget:Math.min(7,Math.max(1,Math.round(Number($("#hTarget").value)||1))),note:$("#hNote").value.trim()};
    const id=f.dataset.id;
    if (id) { S.editing=null; saveHabit(id,patch); say("Amended. The ledger adjusts itself."); }
    else { const nid="h"+Date.now().toString(36); const order=Math.max(0,...S.all.map(h=>Number(h.order)||0))+1; S.addingHabit=false; saveHabit(nid,{...patch,order,active:true,created:today()},true); say("A new habit. I shall keep an eye on it."); }
  };
}
function saveHabit(id, patch, isNew){
  const cur = S.all.find(h=>h.id===id) || {id};
  const body = {...cur, ...patch}; delete body.id;
  if (isNew) S.all.push({id,...body}); else Object.assign(cur, patch);
  splitHabits(); S.confirm=null; render();
  if (db) write("habits/"+id,()=>db.doc("habits/"+id).set(body));
}
S.all=[]; S.retired=[];
function splitHabits(){
  const sorted=[...S.all].sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
  S.habits=sorted.filter(h=>h.active!==false); S.retired=sorted.filter(h=>h.active===false);
}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ S.view=b.dataset.view; S.confirm=null; render(); });

// Connect to the store
function setStatus(t){ const s=$("#status"); s.textContent=t||""; s.hidden=!t; }
render();
(async () => {
  db = openDb("ledger");
  if (!db){ S.loaded.habits=true; render(); setStatus("Open this page in Claude while signed in, and the ledger will remember everything."); return; }
  const timer = setTimeout(()=>setStatus("The ledger can't be reached just yet. Changes may not be saved."), 10000);
  const settle = snap => { if (!snap.metadata.fromCache){ clearTimeout(timer); setStatus(""); } };
  const fail = () => { clearTimeout(timer); setStatus("Lost touch with the ledger. Reopen the page to reconnect."); };
  db.collection("habits").onSnapshot(s=>{ S.all=s.docs.map(d=>({id:d.id,...d.data()})); splitHabits(); S.loaded.habits=true; settle(s); render(); }, fail);
  db.collection("days").onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.days=o; settle(s); render(); }, fail);
  db.collection("store").onSnapshot(s=>{ S.store=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, fail);
  db.collection("spends").onSnapshot(s=>{ S.spends=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, fail);
  // A Peloton class ticks the workout on its own: fetch new classes (at most every 30 minutes) and tick their days.
  const KL = { strength:"Strength", cardio:"Cardio", yoga:"Yoga or stretch" };
  const { training } = linkWorkoutsToLedger(ticked => say(ticked.length===1
    ? `${KL[ticked[0].kind]||"A workout"} ${ticked[0].day===today()?"today":"on "+fmtLong(ticked[0].day).split(" ")[0]}, from Peloton. Ticked for you.`
    : `${ticked.length} Peloton classes ticked for you. The bike reports in.`));
  linkWritingToLedger(ticked => say(ticked.length===1 && ticked[0].day===today()
    ? `Write ticked from the Focus Room: ${ticked[0].minutes} min at the desk.` : `Write ticked for ${ticked.length} day${ticked.length===1?"":"s"} from the Focus Room.`));
  setTimeout(() => fetchPelotonIfStale(training).catch(()=>{}), 1500);
  db.doc("settings/main").onSnapshot(s=>{ if (s.exists) S.settings={streakMode:"grace",...s.data()}; render(); }, fail);
})();
})();
</script>
