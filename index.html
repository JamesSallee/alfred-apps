<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="js/vendor/supabase-2.45.4.js"></script>
<title>Alfred's Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<style>
/* Layout: one narrow column, like the Ledger. Greeting, today's note in brass, then the doors out of the study. */

body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 64px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
a:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.greet{color:var(--muted);font-size:15px}

.note{background:var(--brass-soft);border:1px solid var(--brass);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.note h2{font-size:19px;color:var(--brass)}
.note ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.note li{display:flex;gap:10px;align-items:baseline}
.note li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--brass);transform:translateY(-2px)}
.note a{color:var(--ink);font-weight:700;text-decoration-color:var(--brass);text-underline-offset:3px}

.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rooms{display:flex;flex-direction:column;gap:10px}
.room{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);text-decoration:none;transition:border-color .15s, transform .15s}
.room:hover{border-color:var(--green);transform:translateY(-1px)}
.room .mark{width:44px;height:44px;border-radius:12px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.room .mark svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
.room:hover .mark svg,.room:active .mark svg,.room:focus-visible .mark svg{transform:rotate(-8deg) scale(1.06)}
/* Icons are copies of js/icons.js, kept static so the doors paint at once. */
.room.today{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.room.today .mark{background:var(--brass-soft);color:var(--brass)}
.room .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.room .name{font-family:var(--display);font-size:18px}
.room .desc{font-size:13px;color:var(--muted)}
.room .go{color:var(--green);font-weight:700;font-size:18px}
.room.today .go{color:var(--brass)}
/* A door's live figure takes the arrow's place. */
.room .go.fig{display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right;max-width:9.5em}
.room .go .fv{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.room .go .fc{font-family:var(--body);font-weight:500;font-size:11px;line-height:1.2;color:var(--muted)}
.room .tag{display:inline-block;margin-left:6px;font-family:var(--body);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);vertical-align:2px}

.week{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.week h2{font-size:19px}
.week .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.week .stat{display:flex;flex-direction:column;gap:2px}
.week .big{font-family:var(--display);font-size:24px;color:var(--green);font-variant-numeric:tabular-nums}
.week .sm{font-size:12.5px;color:var(--muted)}
.week ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.week li{display:flex;justify-content:space-between;gap:12px}
.week li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.week[hidden]{display:none}
footer{font-size:12.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:14px}
/* Tablets in landscape and desktops: two columns of doors so all nine fit on one screen. */
@media (min-width:900px){.wrap{max-width:1000px}.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion: reduce){.room,.room .mark svg{transition:none}.room:hover{transform:none}.room:hover .mark svg,.room:active .mark svg,.room:focus-visible .mark svg{transform:none}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow" id="date">Monday 2 November</span>
    <h1>Alfred's Study</h1>
    <span class="greet" id="greet"></span>
  </header>

  <section class="note" aria-labelledby="noteh">
    <h2 id="noteh">Today's note</h2>
    <ul id="notes"></ul>
  </section>

  <section class="week" id="week" aria-labelledby="weekh" hidden>
    <h2 id="weekh">This week</h2>
    <div class="stats">
      <div class="stat"><span class="big" id="wk-ticks">0</span><span class="sm">habit ticks</span></div>
      <div class="stat"><span class="big" id="wk-focus">0</span><span class="sm">focus minutes</span></div>
      <div class="stat"><span class="big" id="wk-sun">–</span><span class="sm">last shutdown</span></div>
    </div>
    <ul id="wk-habits"></ul>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px" aria-labelledby="roomsh">
    <span class="label" id="roomsh">The rooms</span>
    <nav class="rooms" id="rooms"></nav>
  </section>

  <footer id="foot">Pin this page or add it to your home screen. Everything else is one tap away.</footer>
</div>

<script type="module">
import { esc } from "./js/ui.js";
import { ymd } from "./js/dates.js";
import { mountShell } from "./js/shell.js";
import { openStore } from "./js/sync.js";
import { doorFigures } from "./js/rooms.js";
import { greeting, todaysNote } from "./js/study.js";
import { ROOMS } from "./js/registry.js";
import { iconSvg } from "./js/icons.js";
mountShell(null);

// ---------- The doors, one per room (js/registry.js) ----------
document.getElementById("rooms").innerHTML = ROOMS.map((r) => `
      <a class="room" id="r-${r.id}" href="${r.href}">
        <span class="mark" aria-hidden="true">${iconSvg(r.id)}</span>
        <span class="txt"><span class="name">${r.name}</span><span class="desc">${r.desc}</span></span>
        <span class="go" aria-hidden="true">→</span>
      </a>`).join("");

// ---------- One live figure on each door ----------
{
  const names = ROOMS.map(r => r.id);
  const stores = Object.fromEntries(ROOMS.map(r => [r.id, openStore(r.store)]));
  let queued = false;
  const paint = () => {
    queued = false;
    const F = doorFigures(stores);
    names.forEach(n => {
      const go = document.querySelector(`#r-${n} .go`); if (!go) return;
      const f = F[n];
      go.classList.toggle("fig", !!f);
      go.setAttribute("aria-hidden", f ? "false" : "true");
      go.innerHTML = f ? `<span class="fv">${esc(f.v)}</span><span class="fc">${esc(f.c)}</span>` : "→";
    });
  };
  const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(paint); } };
  Object.values(stores).forEach(s => s.subscribe(schedule));
}

// ---------- This week (Monday to today), read from the synced stores ----------
{
  const today = new Date(); today.setHours(0,0,0,0);
  const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const days = []; for (let d = new Date(monday); d <= today; d.setDate(d.getDate()+1)) days.push(ymd(d));
  const ledger = openStore("ledger"), focus = openStore("focus"), shutdown = openStore("shutdown");
  const fmt = (s) => new Date(s + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  function renderWeek() {
    const habits = ledger.list("habits/").map(x => ({ id: x.key.slice(7), ...x.value }))
      .filter(h => h.active !== false).sort((a,b) => (Number(a.order)||0) - (Number(b.order)||0));
    let ticks = 0; const per = {};
    days.forEach(d => { const done = ledger.get("days/" + d)?.done || {}; Object.keys(done).forEach(id => { ticks++; per[id] = (per[id]||0) + 1; }); });
    const since = monday.getTime();
    const mins = focus.list("log/").map(x => x.value).filter(e => e.k === "focus" && e.t >= since).reduce((a,e) => a + (e.m||0), 0);
    const last = shutdown.list("shutdowns/").map(x => x.value).sort((a,b) => a.date < b.date ? 1 : -1)[0];
    document.getElementById("wk-ticks").textContent = ticks;
    document.getElementById("wk-focus").textContent = mins;
    document.getElementById("wk-sun").textContent = last ? fmt(last.date) : "\u2013";
    document.getElementById("wk-habits").innerHTML = habits.filter(h => h.kind !== "weekly").slice(0, 8)
      .map(h => `<li><span>${esc(h.name || "Habit")}</span><span>${per[h.id]||0} of ${days.length}</span></li>`).join("")
      + (last && last.word ? `<li><span>This week's word</span><span>${esc(last.word)}</span></li>` : "");
    document.getElementById("week").hidden = !(habits.length || mins || last);
  }
  [ledger, focus, shutdown].forEach(s => s.subscribe(renderWeek));
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

(function(){
  const now = new Date();
  const day = now.getDay();           // 0 Sun … 6 Sat
  const date = now.getDate();
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("date").textContent = DAYS[day] + " " + date + " " + MONTHS[now.getMonth()];

  // Today's note and the greeting come from the database ("study" / "notes") and the rooms, not the code,
  // so nothing personal sits in this public repo. The rules live in js/study.js, shared with the console.
  const stores = { study: openStore("study"), desk: openStore("desk"), wardrobe: openStore("wardrobe"), todo: openStore("todo") };
  function renderNote() {
    document.getElementById("greet").textContent = greeting(stores.study, now);
    document.getElementById("notes").innerHTML = todaysNote(stores, now).map(n => "<li><span>" + n + "</span></li>").join("");
  }
  Object.values(stores).forEach(s => s.subscribe(renderNote));

  // Highlight the room that matters today
  const todayRoom = day === 0 ? "r-shutdown" : "r-ledger";
  const el = document.getElementById(todayRoom);
  el.classList.add("today");
  el.querySelector(".name").insertAdjacentHTML("beforeend", '<span class="tag">Today</span>');
})();
</script>
