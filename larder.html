<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<link rel="manifest" href="larder.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Larder">
<script src="js/vendor/supabase-2.45.4.js"></script>
<title>The Larder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* The Larder: the shared grocery list first, then the pantry, the cookbook and Alfred's suggestions.
   Same paper, green and brass as the Study. One page; the tab bar swaps the four rooms. */
:root{
  --bg:#eef1ec; --paper:#f8faf6; --ink:#1d2b24; --muted:#5d6b63; --line:#d3dbd4; --rule:#e3e9e4;
  --green:#1f4d3a; --green-ink:#f4f7f2; --green-soft:#dce8e0; --brass:#a87a1f; --brass-ink:#7a5810; --brass-soft:#f3e7c8;
  --danger:#9b3b2e;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tabs:72px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a16; --paper:#18241f; --ink:#e6ece7; --muted:#9aa9a0; --line:#2b3a33; --rule:#22302a;
  --green:#7fbf9d; --green-ink:#10201a; --green-soft:#21352c; --brass:#d9ad55; --brass-ink:#e6c27a; --brass-soft:#3a3020;
  --danger:#e08a7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a16; --paper:#18241f; --ink:#e6ece7; --muted:#9aa9a0; --line:#2b3a33; --rule:#22302a;
  --green:#7fbf9d; --green-ink:#10201a; --green-soft:#21352c; --brass:#d9ad55; --brass-ink:#e6c27a; --brass-soft:#3a3020;
  --danger:#e08a7b; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding:0 max(16px, env(safe-area-inset-left, 0px)) calc(var(--tabs) + 72px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow,.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
[hidden]{display:none !important}

header.top{display:flex;flex-direction:column;gap:4px}
header.top .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.who{display:flex}
.who span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--bg);margin-left:-8px}
.who span:first-child{margin-left:0}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px}
.note{background:var(--brass-soft);border:1px solid var(--brass);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.note .label{color:var(--brass-ink);font-weight:700}
.note a{color:var(--ink);font-weight:700;text-decoration-color:var(--brass);text-underline-offset:3px}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);min-height:34px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"],.chip.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.chip.soft{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip.dash{border-style:dashed;background:transparent;color:var(--muted)}
.chip .x{font-size:15px;line-height:1;opacity:.75}

.adder{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 14px}
.adder input{flex:1;min-width:0;border:0;background:transparent;height:42px;outline:none}
.adder select{border:0;background:transparent;height:42px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.brass{background:var(--brass-soft);border-color:var(--brass);color:var(--brass-ink)}
.btn.ghost{background:transparent}
.btn.sq{width:42px;height:42px;padding:0;border-radius:10px;font-size:22px;line-height:1}
.btn.big{height:50px;font-size:16px;border-radius:14px}
.btn[disabled]{opacity:.55;cursor:default}
.btn .cost{font-weight:500;opacity:.8}
.btn.stack{flex-direction:column;gap:0;height:56px;line-height:1.2}
.btn.stack .cost{font-size:12px}
.linkbtn{border:0;background:none;padding:8px 0;color:var(--green);font-weight:600;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* list rows */
.group{display:flex;flex-direction:column;gap:6px}
.rows{overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-top:1px solid var(--rule);min-height:52px;background:var(--paper);touch-action:pan-y}
.item:first-child{border-top:0}
.tick{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--green);background:transparent;display:grid;place-items:center;padding:0;color:var(--green-ink)}
.tick.done{background:var(--green)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;border:0;background:none;text-align:left;padding:4px 0}
.item .name{font-weight:500;overflow-wrap:anywhere}
.item .for{font-size:12px;color:var(--brass-ink)}
.item .by{font-size:11px;font-weight:700;color:var(--muted);min-width:14px;text-align:center}
.item .handle{flex:none;width:32px;height:40px;border:0;background:none;color:var(--muted);touch-action:none;cursor:grab;display:grid;place-items:center}
.item.dragging{opacity:.9;box-shadow:0 6px 16px rgba(0,0,0,.18);position:relative;z-index:2}
.item.isdone .name{text-decoration:line-through;color:var(--muted)}
.ticked-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.ticked-head button{border:0;background:none;color:var(--muted);padding:8px 0;font-size:13px}

/* pantry */
.soon-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;padding:2px 0;text-align:left;width:100%}
.soon-row b{font-weight:600}
.ptools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
details.place{display:block}
details.place>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0;font-family:var(--display,inherit);font-size:20px}
details.place>summary::-webkit-details-marker{display:none}
details.place>summary::before{content:"▸";font-size:13px;color:var(--muted);transition:transform .15s}
details.place[open]>summary::before{transform:rotate(90deg)}
details.place>summary .count{font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);background:var(--rule);border-radius:999px;padding:2px 8px}
details.place[open]>.group{margin-top:10px}
.prow{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 12px;border:0;border-top:1px solid var(--rule);background:none;text-align:left;font:inherit;color:inherit}
.prow:first-child{border-top:0}
.prow .pn{flex:1;min-width:0;overflow-wrap:anywhere}
.prow .tick{pointer-events:none}
.keep{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.keep.soon{color:var(--brass-ink)}
.keep.gone{color:#b3261e}
.tidybar{position:sticky;bottom:calc(124px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:8px;background:var(--bg);border-radius:14px}
.soon-row span{font-size:12px;font-weight:700;color:var(--brass-ink)}

/* cookbook + meals */
.recipe{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%;color:inherit}
.ring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--green)}
.recipe .t{font-family:var(--display);font-size:17px;line-height:1.2}
.recipe .m{font-size:12.5px;color:var(--muted)}
.meal{padding:14px;display:flex;flex-direction:column;gap:8px}
.meal .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.meal .t{font-family:var(--display);font-size:18px;line-height:1.2}
.badge{flex:none;font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:3px 8px;white-space:nowrap}
.meal .acts{display:flex;gap:8px;flex-wrap:wrap}
.meal .acts .btn{height:38px;font-size:13px}
.meal ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:8px 10px;display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--green)}
.stat span{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;font-weight:700}
.ing{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--rule);font-size:14px}
.ing:first-child{border-top:0}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--green)}
.dot.need{background:transparent;border:2px solid var(--brass)}
.ing .flag{font-size:12px;font-weight:700;color:var(--brass-ink)}
.ing button{border:0;background:none;color:var(--green);font-weight:700;font-size:18px;width:32px;height:32px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
body.cook .steps{font-size:20px;line-height:1.5}
body.cook .ings-wrap{display:none}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;resize:vertical}

/* tabs, sheet, toast */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{height:var(--tabs);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--green)}
nav.tabs svg{width:22px;height:22px}
.al-pill{bottom:calc(var(--tabs) + 10px + env(safe-area-inset-bottom)) !important}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{width:min(560px,100%);background:var(--paper);border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.sheet input[type=text],.sheet input[type=date],.sheet select{height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;padding:0 12px;width:100%}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs) + 56px + env(safe-area-inset-bottom));z-index:70;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.toast button{border:0;background:none;color:var(--brass);font-weight:700;padding:4px 0}
.busy{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:18px 14px;text-align:center;color:var(--muted);font-size:14px}
.err{color:var(--danger);font-size:14px}
@media (prefers-reduced-motion: reduce){.busy{animation:none}}
.back{display:inline-block;color:var(--green);font-weight:600;text-decoration:none;font-size:14px;margin-bottom:6px}
.back[hidden]{display:none}
</style>

<div class="wrap">
  <!-- Only the Larder's owner sees the way back to the Study; household members (Maggie) don't. -->
  <a class="back" id="study-link" href="./" hidden>← The Study</a>

  <!-- ===================== LIST ===================== -->
  <section id="v-list" data-view="list">
    <header class="top">
      <span class="eyebrow" id="list-eyebrow">The Larder</span>
      <div class="row"><h1>Groceries</h1><div class="who" id="who" aria-label="Who's on this list"></div></div>
    </header>
    <div class="chips" id="lists" style="margin-top:10px"></div>
    <form class="adder" id="add-item" style="margin-top:12px" autocomplete="off">
      <label class="sr" for="add-item-name">Add an item</label>
      <input id="add-item-name" placeholder="Add an item…" enterkeyhint="done">
      <button class="btn primary sq" aria-label="Add">+</button>
    </form>
    <div id="list-body" style="display:flex;flex-direction:column;gap:14px;margin-top:14px"></div>
  </section>

  <!-- ===================== PANTRY ===================== -->
  <section id="v-pantry" data-view="pantry" hidden>
    <header class="top">
      <span class="eyebrow">The Larder</span>
      <h1>Pantry</h1>
      <span class="muted">What's in the house. Alfred cooks from this.</span>
    </header>
    <div class="two" style="margin-top:12px">
      <label class="btn" id="snap-fridge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Snap the fridge
        <input type="file" accept="image/*" capture="environment" class="sr" id="fridge-photo">
      </label>
      <button class="btn" type="button" id="pantry-add-open">+ Add by hand</button>
    </div>
    <form class="adder" id="add-pantry" style="margin-top:10px" hidden autocomplete="off">
      <label class="sr" for="add-pantry-name">Add to the pantry</label>
      <input id="add-pantry-name" placeholder="e.g. Feta" enterkeyhint="done">
      <label class="sr" for="add-pantry-where">Where</label>
      <select id="add-pantry-where"><option value="fridge">Fridge</option><option value="cupboard">Cupboard</option><option value="freezer">Freezer</option></select>
      <button class="btn primary sq" aria-label="Add">+</button>
    </form>
    <div id="photo-review" style="margin-top:12px"></div>
    <div id="pantry-body" style="display:flex;flex-direction:column;gap:14px;margin-top:14px"></div>
  </section>

  <!-- ===================== COOKBOOK ===================== -->
  <section id="v-cookbook" data-view="cookbook" hidden>
    <header class="top">
      <span class="eyebrow" id="cb-count">The Larder</span>
      <h1>Cookbook</h1>
    </header>
    <form class="adder" id="cb-form" style="margin-top:12px" autocomplete="off">
      <label class="sr" for="cb-input">Paste a recipe link, or search your cookbook</label>
      <input id="cb-input" placeholder="Paste a link, or search…" enterkeyhint="go">
      <button class="btn primary" id="cb-go" style="height:42px">Save</button>
    </form>
    <div class="chips" style="margin-top:10px">
      <label class="chip dash" style="cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Snap a cookbook page
        <input type="file" accept="image/*" capture="environment" class="sr" id="page-photo">
      </label>
    </div>
    <div class="chips" id="cb-with" style="margin-top:6px"></div>
    <div id="cb-status" style="margin-top:10px"></div>
    <div id="cb-body" style="display:flex;flex-direction:column;gap:10px;margin-top:12px"></div>
    <div id="web-body" style="display:flex;flex-direction:column;gap:10px;margin-top:10px"></div>
  </section>

  <!-- ===================== RECIPE ===================== -->
  <section id="v-recipe" data-view="recipe" hidden></section>

  <!-- ===================== ASK ALFRED ===================== -->
  <section id="v-ask" data-view="ask" hidden>
    <header class="top">
      <div class="row"><span class="eyebrow">The Larder</span>
        <button class="linkbtn" type="button" id="rules-open">House rules</button></div>
      <h1>What shall we eat?</h1>
    </header>
    <div id="ask-onhand" style="margin-top:12px"></div>
    <div class="chips" id="ask-pins" style="margin-top:12px"></div>
    <span class="label" style="display:block;margin-top:12px">Tonight's mood</span>
    <div class="chips" id="moods" style="margin-top:6px"></div>
    <label class="sr" for="ask-note">Anything else?</label>
    <input id="ask-note" class="card" placeholder="Anything else? (e.g. Maggie's out, just me)" style="margin-top:10px;width:100%;height:44px;padding:0 14px">
    <div class="two" style="grid-template-columns:3fr 2fr;margin-top:10px">
      <button class="btn primary big stack" type="button" id="ask-go">Ask Alfred <span class="cost">about 2¢</span></button>
      <button class="btn big stack" type="button" id="web-go" style="font-size:14px">Search the web <span class="cost">about 6¢</span></button>
    </div>
    <div class="small muted" id="spend" style="margin-top:6px"></div>
    <div id="ask-body" style="display:flex;flex-direction:column;gap:10px;margin-top:12px"></div>
  </section>
</div>

<nav class="tabs" aria-label="Rooms">
  <button type="button" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>List</button>
  <button type="button" data-tab="pantry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 10h14M8 6v2M8 13v3"/></svg>Pantry</button>
  <button type="button" data-tab="cookbook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Cookbook</button>
  <button type="button" data-tab="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></svg>Ask Alfred</button>
</nav>

<div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" id="sheet-panel"></div></div>
<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button type="button" id="toast-undo" hidden>Undo</button></div>

<script type="module">
import { mountShell } from "./js/shell.js";
import { openStore, supabase, currentUser } from "./js/sync.js";

// Shared with the household (sync.js knows "larder" is a shared app).
const store = openStore("larder");
mountShell("larder");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

// ---------- small helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const daysUntil = (ymd) => Math.round((new Date(ymd + "T12:00") - new Date(today() + "T12:00")) / 864e5);
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const cents = (usd) => usd < 0.995 ? `${(usd * 100).toFixed(usd < 0.1 ? 1 : 0)}¢` : `$${usd.toFixed(2)}`;

];

const keepsDays = (name) => { const a = aisleOf(name); return a === "Produce" ? 5 : a === "Meat & fish" ? 3 : a === "Dairy & eggs" ? 7 : a === "Bakery" ? 4 : null; };

async function photoPayload(file) {
  const img = await createImageBitmap(file).catch(() => null);
  if (!img) throw new Error("That photo wouldn't open.");
  const scale = Math.min(1, 1400 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { image: c.toDataURL("image/jpeg", 0.82).split(",")[1], media_type: "image/jpeg" };
}

let useWhatWeHave = true, cbQuery = "", webResults = null;
function scoreRecipe(r, names) {
  const ings = r.ingredients || [];
  const have = ings.filter((l) => onHand(l, names)).length;
  return { have, total: ings.length, ratio: ings.length ? have / ings.length : 0 };
}
function renderCookbook() {
  const all = recipes();
  $("cb-count").textContent = `The Larder · ${plural(all.length, "recipe", "recipes")}`;
  $("cb-with").innerHTML = `<span class="small muted">Cooking with</span>
    <button class="chip${useWhatWeHave ? " on" : ""}" type="button" data-wwh aria-pressed="${useWhatWeHave}">What we have</button>
    ${pins().map((p) => `<button class="chip soft" type="button" data-unpin="${esc(p)}" aria-label="Unpin ${esc(p)}">${esc(p)} <span class="x" aria-hidden="true">×</span></button>`).join("")}
    <button class="chip dash" type="button" data-addpin>+ add</button>`;
  const names = pantryNameList();
  const pinWords = pins().map((p) => norm(p.replace(/^(use up|fancy|want)\s+/i, "")));

  let list = all.map((r) => ({ r, ...scoreRecipe(r, names) }));
  if (q.length) list = list.filter(({ r }) => { const w = new Set(norm(r.title + " " + (r.ingredients || []).join(" ") + " " + (r.tags || []).join(" "))); return q.every((x) => w.has(x)); });
  const pinHit = ({ r }) => pinWords.some((p) => p.length && onHand((r.ingredients || []).join(" ") + " " + r.title, [p]));
  list.sort((a, b) => (pinHit(b) - pinHit(a)) || (useWhatWeHave ? b.ratio - a.ratio : 0) || ((b.r.fav ? 1 : 0) - (a.r.fav ? 1 : 0)) || ((b.r.created || 0) - (a.r.created || 0)));
  $("cb-body").innerHTML = list.length ? list.map(({ r, have, total }) => {

      </div></a>`;

}

let servings = null, wakeLock = null;
const releaseWake = () => { wakeLock?.release?.().catch(() => {}); wakeLock = null; };
const FRACS = { "¼": 0.25, "½": 0.5, "¾": 0.75, "⅓": 1 / 3, "⅔": 2 / 3, "⅛": 0.125 };
function scaleLine(line, k) {
  if (k === 1) return line;
  return line.replace(/^(\d+\s+\d\/\d|\d+\/\d|\d+(?:\.\d+)?(?:\s*[¼½¾⅓⅔⅛])?|[¼½¾⅓⅔⅛])/, (m) => {
    let v = 0;
    m.trim().split(/\s+/).forEach((p) => {
      if (/^\d+\/\d+$/.test(p)) { const [a, b] = p.split("/"); v += a / b; }
      else { const f = p.match(/[¼½¾⅓⅔⅛]/); v += parseFloat(p) || 0; if (f) v += FRACS[f[0]]; }
    });
    const x = v * k;
    const whole = Math.floor(x), frac = x - whole;
    const nice = [[0, ""], [0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"], [1, ""]].reduce((a, b) => Math.abs(b[0] - frac) < Math.abs(a[0] - frac) ? b : a);
    const w = whole + (nice[0] === 1 ? 1 : 0);
    return x >= 10 ? String(Math.round(x)) : (w ? String(w) : "") + nice[1] || "0";
  });
}

    toast(`Added ${plural(added.length, "item", "items")} to the list.`, () => added.forEach((k) => store.remove(k)));

}

// ===================== ASK ALFRED =====================
const MOODS = ["Fresh", "High protein", "Quick", "Comfort", "Use it up"];
let moods = (() => { try { return JSON.parse(localStorage.getItem("larder:moods")) || ["Fresh", "High protein"]; } catch { return ["Fresh", "High protein"]; } })();
let asking = false;
function renderAsk() {
  const ps = pantry();
  const soon = ps.filter((p) => p.useBy && daysUntil(p.useBy) <= 3).map((p) => p.name);
  const rest = ps.map((p) => p.name).filter((n) => !soon.includes(n));
  $("ask-onhand").innerHTML = ps.length ? `<div class="note"><span class="label">On hand${soon.length ? " · use soon first" : ""}</span>
    <span class="small" style="line-height:1.5">${soon.map((n) => `<b>${esc(n)}</b>`).join(", ")}${soon.length && rest.length ? ", " : ""}${esc(rest.slice(0, 30).join(", "))}${rest.length > 30 ? "…" : ""}</span></div>`
    : `<div class="note"><span class="label">On hand</span><span class="small">The pantry is empty, so Alfred will assume a bare cupboard. <a href="#pantry">Stock the pantry</a> for better ideas.</span></div>`;
  $("ask-pins").innerHTML = `<span class="label">Pinned</span>${pins().map((p) => `<button class="chip soft" type="button" data-unpin="${esc(p)}" aria-label="Unpin ${esc(p)}">${esc(p)} <span class="x" aria-hidden="true">×</span></button>`).join("")}<button class="chip dash" type="button" data-addpin>+ pin</button>`;
  $("moods").innerHTML = MOODS.map((m) => `<button class="chip" type="button" data-mood="${esc(m)}" aria-pressed="${moods.includes(m)}">${esc(m)}</button>`).join("");
  renderSuggestions();
}
$("ask-pins").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.unpin) setPins(pins().filter((p) => p !== b.dataset.unpin));
  if ("addpin" in b.dataset) pinSheet();
});
$("moods").addEventListener("click", (e) => {
  const b = e.target.closest("[data-mood]"); if (!b) return;
  const m = b.dataset.mood;
  moods = moods.includes(m) ? moods.filter((x) => x !== m) : [...moods, m];
  try { localStorage.setItem("larder:moods", JSON.stringify(moods)); } catch {}
  renderAsk();
});
$("rules-open").onclick = () => openSheet(`<h2>House rules</h2>
  <p class="small muted" style="margin:0">Alfred reads these before every suggestion and web search: tastes, goals, dislikes, allergies, how long you'll cook on a weeknight.</p>
  <label class="sr" for="rules-in">House rules</label>
  <textarea id="rules-in" style="min-height:160px" placeholder="e.g. Healthy by default with the occasional comfort food. Simple to cook, lots of flavour. Plenty of fresh produce. High protein.">${esc(settings().rules || "")}</textarea>
  <button class="btn primary" type="button" id="rules-save">Save</button>`, (p) => {
  p.querySelector("#rules-save").onclick = () => { store.set("settings", { ...settings(), rules: p.querySelector("#rules-in").value.trim() }); closeSheet(); toast("House rules saved."); };
});
function askContext() {
  const ps = pantry();
  return {
    pantry: ps.map((p) => p.name),
    soon: ps.filter((p) => p.useBy && daysUntil(p.useBy) <= 3).map((p) => p.name),
    pins: pins(), moods, note: $("ask-note").value.trim(), rules: settings().rules || "",
  };
}
$("ask-go").onclick = async () => {
  if (asking) return; asking = true; busyAsk("Alfred is thinking it over…");
  try {
    const cookbook = recipes().map((r) => ({ id: r.id, title: r.title, ingredients: (r.ingredients || []).map(shortName) }));
    const res = await ai("suggest", { ...askContext(), cookbook });
    store.set("suggestions/latest", { kind: "meals", at: Date.now(), by: me.initial, note: res.note || "", meals: res.meals || [], cost: res.cost || 0 });
    showSpend(res);
  } catch (err) { $("ask-body").innerHTML = `<div class="card empty err">${esc(err.message)}</div>`; }
  finally { asking = false; renderSuggestions(); }
};
$("web-go").onclick = () => webSearch($("ask-body"), true);
async function webSearch(target, fromAsk = false) {
  if (asking) return; asking = true;
  target.innerHTML = `<div class="card empty"><span class="busy"></span> Searching recipe sites. This takes a little while…</div>`;
  try {
    const res = await ai("web_search", askContext());
    store.set("suggestions/web", { kind: "web", at: Date.now(), by: me.initial, note: res.note || "", recipes: res.recipes || [], cost: res.cost || 0 });
    showSpend(res);
  } catch (err) { target.innerHTML = `<div class="card empty err">${esc(err.message)}</div>`; asking = false; return; }
  asking = false;
  if (fromAsk) renderSuggestions(); else renderWeb(target);
}
function busyAsk(text) { $("ask-body").innerHTML = `<div class="card empty"><span class="busy"></span> ${esc(text)}</div>`; }
const ago = (t) => { const m = Math.round((Date.now() - t) / 6e4); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "short" }); };
function renderSuggestions() {
  if (asking) return;
  const s = store.get("suggestions/latest"), w = store.get("suggestions/web");
  const latest = [s, w].filter(Boolean).sort((a, b) => b.at - a.at)[0];
  if (!latest) { $("ask-body").innerHTML = `<div class="card empty">Pick a mood and ask. Nothing is charged until you press a button.</div>`; return; }
  if (latest.kind === "web") return renderWeb($("ask-body"));
  const names = pantryNameList();
  $("ask-body").innerHTML = `${latest.note ? `<p class="small muted" style="margin:0;font-style:italic">“${esc(latest.note)}” · Alfred, ${ago(latest.at)}${latest.by ? " for " + esc(latest.by) : ""}</p>` : ""}
    ${latest.meals.map((m, n) => {
      const need = (m.ingredients || []).filter((i) => !i.have && !onHand(i.item, names));
      const linked = m.cookbook_id && recipes().some((r) => r.id === m.cookbook_id);
      const onList = new Set(items().filter((i) => !i.done).map((i) => norm(i.name).join(" ")));
      const listed = need.length && need.every((i) => onList.has(norm(i.item).join(" ")));
      return `<div class="card meal">
        <div class="head"><span class="t">${esc(m.title)}</span><span class="badge">${m.protein_g} g protein</span></div>
        <span class="small muted">${esc([linked ? "From your cookbook" : "", m.minutes ? m.minutes + " min" : "", m.veg_portions ? plural(m.veg_portions, "veg portion", "veg portions") : "", m.steps?.length ? plural(m.steps.length, "step", "steps") : ""].filter(Boolean).join(" · "))}</span>
        <span class="small">${esc(m.why || "")}</span>
        <span class="small">Need: <b>${need.length ? esc(need.map((i) => i.item).join(", ")) : "nothing, all on hand"}</b></span>
        <div class="acts">
          ${listed ? `<span class="btn ghost" style="border-color:transparent;color:var(--green)">✓ On the list</span>` : need.length ? `<button class="btn primary" type="button" data-need="${n}">Add ${need.length} to list</button>` : ""}
          ${linked ? `<a class="btn" href="#recipe/${esc(m.cookbook_id)}">Open recipe</a>` : `<button class="btn" type="button" data-save="${n}">Save to cookbook</button>`}
          <button class="btn ghost" type="button" data-steps="${n}" aria-expanded="false">Method</button>
        </div>
        <ol hidden data-ol="${n}">${(m.steps || []).map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
      </div>`;
    }).join("")}
    <span class="small muted">${latest.cost ? "That ask cost " + cents(latest.cost) + "." : ""}</span>`;
  const box = $("ask-body");
  box.querySelectorAll("[data-need]").forEach((b) => (b.onclick = () => {
    const m = latest.meals[+b.dataset.need];
    const need = m.ingredients.filter((i) => !i.have && !onHand(i.item, pantryNameList()));
    const added = need.map((i) => addItem(i.item, { meal: m.title, by: "A" })).filter((x) => x?.id).map((x) => "items/" + x.id);
    toast(`Added ${plural(added.length, "item", "items")} for ${m.title}.`, () => added.forEach((k) => store.remove(k)));
  }));
  box.querySelectorAll("[data-save]").forEach((b) => (b.onclick = () => {
    const m = latest.meals[+b.dataset.save];
    const id = saveRecipe({ title: m.title, site: "Alfred's idea", servings: m.servings || 2, minutes: m.minutes, protein_g: m.protein_g, ingredients: m.ingredients.map((i) => i.item), steps: m.steps });
    latest.meals[+b.dataset.save] = { ...m, cookbook_id: id };
    store.set("suggestions/latest", latest);
    toast("Saved to the cookbook.");
  }));
  box.querySelectorAll("[data-steps]").forEach((b) => (b.onclick = () => {
    const ol = box.querySelector(`[data-ol="${b.dataset.steps}"]`); ol.hidden = !ol.hidden; b.setAttribute("aria-expanded", String(!ol.hidden));
  }));
}
function renderWeb(target) {
  if (asking) return;
  const w = store.get("suggestions/web");
  if (!w || (target.id === "web-body" && Date.now() - w.at > 3 * 864e5)) { if (target.id === "web-body") target.innerHTML = ""; return; }
  target.innerHTML = `<span class="label">From the web · ${ago(w.at)}</span>
    ${w.note ? `<p class="small muted" style="margin:0;font-style:italic">“${esc(w.note)}” · Alfred</p>` : ""}
    ${w.recipes.map((r, n) => {
      const saved = r.url ? recipes().find((x) => x.url === r.url) : r.cookbook_id && recipes().find((x) => x.id === r.cookbook_id);
      return `<div class="card meal">
        <div class="head"><span class="t">${esc(r.title)}</span>${r.protein_g ? `<span class="badge">~${r.protein_g} g protein</span>` : ""}</div>
        ${r.url ? `<a class="small muted" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.site || new URL(r.url).hostname)}${r.minutes ? " · " + r.minutes + " min" : ""} ↗</a>`
          : `<span class="small muted">Alfred's idea, no good page found${r.minutes ? " · " + r.minutes + " min" : ""}</span>`}
        <span class="small">${esc(r.why || "")}</span>
        ${r.need?.length ? `<span class="small">Need: <b>${esc(r.need.join(", "))}</b></span>` : ""}
        <div class="acts">${saved ? `<a class="btn" href="#recipe/${esc(saved.id)}">Open saved recipe</a>` : `<button class="btn primary" type="button" data-wsave="${n}">Save to cookbook</button>`}</div>
      </div>`;
    }).join("")}
    <span class="small muted">${w.cost ? "That search cost " + cents(w.cost) + "." : ""}</span>`;
  target.querySelectorAll("[data-wsave]").forEach((b) => (b.onclick = () => {
    const r = w.recipes[+b.dataset.wsave];
    if (r.url) return importUrl(r.url);
    r.cookbook_id = saveRecipe({ title: r.title, site: "Alfred's idea", servings: 2, minutes: r.minutes, protein_g: r.protein_g, ingredients: r.ingredients || [], steps: r.steps || [] });
    store.set("suggestions/web", w);
    renderWeb(target);
  }));
}

// ---------- talking to the server ----------
async function ai(action, body) {
  if (!navigator.onLine) throw new Error("You're offline. Alfred needs a connection for this.");
  if (!(await currentUser().catch(() => null))) throw new Error("Sign in first (tap the status pill at the bottom).");
  const { data, error } = await supabase.functions.invoke("larder-ai", { body: { action, ...body } });
  if (error) {
    let msg = "Alfred couldn't be reached. Try again in a moment.";
    try { const j = await error.context?.json?.(); if (j?.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}
const costLine = (res) => (res.cost ? `That cost ${cents(res.cost)}.` : "");
function showSpend(res) { if (res?.cap) $("spend").textContent = `This month: ${cents(res.spent || 0)} of $${Number(res.cap).toFixed(2)}.`; }
async function refreshSpend() {
  try { if (navigator.onLine && (await currentUser())) showSpend(await ai("usage", {})); } catch { /* quiet: it's only a nicety */ }
}

// ---------- arrivals from the Share menu (?url= / ?text=) ----------
function sharedLink() {
  const p = new URLSearchParams(location.search);
  const raw = [p.get("url"), p.get("text"), p.get("title")].filter(Boolean).join(" ");
  const m = raw.match(/https?:\/\/[^\s]+/);
  if (p.toString()) history.replaceState(null, "", location.pathname + "#cookbook");
  return m ? m[0] : null;
}
// Arriving from a sign-in email, the address carries the session (#access_token=… or ?code=…).
// Let Supabase read it before the tab routing or the Share handler rewrites the address.
if (/access_token=|error_description=/.test(location.hash) || new URLSearchParams(location.search).has("code")) {
  try { await supabase.auth.getSession(); } catch { /* the sign-in sheet will say what went wrong */ }
  if (/access_token=|error_description=/.test(location.hash)) history.replaceState(null, "", location.pathname + "#list");
}
const shared = sharedLink();
store.subscribe(() => { if (!dragging) render(); });
// Whose Larder this is is only known once the store has checked the household, so look again on each sync.
store.onStatus(async (st) => {
  if (st === "signed-out") me = { id: null, initial: "" };
  else if (!me.id) { const u = await currentUser().catch(() => null); if (u) me = { id: u.id, initial: (u.email || "?")[0].toUpperCase() }; }
  showStudyLink();
});
fromHash();
if (shared) { go("cookbook"); importUrl(shared); }
</script>
