<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="js/vendor/supabase-2.45.4.js"></script>
<title>Sunday Shutdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, a single step on screen at a time, like turning the pages of the ledger at dusk. Same family as the Daily Ledger. */
:root{
  --bg:#eef1ec; --paper:#f8faf6; --ink:#1d2b24; --muted:#5d6b63; --line:#d3dbd4;
  --green:#1f4d3a; --green-soft:#dce8e0; --brass:#a87a1f; --brass-soft:#f3e7c8;
  --on-green:#f4f7f2; --worry:#6b5a8e; --worry-soft:#e7e2f0; --danger:#9b3b2e;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a16; --paper:#18241f; --ink:#e6ece7; --muted:#9aa9a0; --line:#2b3a33;
  --green:#7fbf9d; --green-soft:#21352c; --brass:#d9ad55; --brass-soft:#3a3020;
  --on-green:#10201a; --worry:#b9a8e0; --worry-soft:#2c2740; --danger:#e08a7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a16; --paper:#18241f; --ink:#e6ece7; --muted:#9aa9a0; --line:#2b3a33;
  --green:#7fbf9d; --green-soft:#21352c; --brass:#d9ad55; --brass-soft:#3a3020;
  --on-green:#10201a; --worry:#b9a8e0; --worry-soft:#2c2740; --danger:#e08a7b; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 80px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px}
.clock{text-align:right}
.clock .t{font-family:var(--display);font-size:28px;line-height:1;color:var(--brass)}
.clock .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

ol.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
ol.steps li{display:flex;flex-direction:column;gap:5px;min-width:0}
ol.steps .bar{height:4px;border-radius:2px;background:var(--line)}
ol.steps .nm{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol.steps li.done .bar{background:var(--green)}
ol.steps li.on .bar{background:var(--brass)}
ol.steps li.on .nm{color:var(--ink);font-weight:600}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:22px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--brass);font-weight:600}
.lede{color:var(--muted)}
.alfred{border-left:2px solid var(--brass);padding-left:12px;font-style:italic;color:var(--muted)}

.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn[disabled]{opacity:.45;cursor:default}
.nav{display:flex;justify-content:space-between;gap:8px;align-items:center}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f span.hint{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:64px}

/* Intro */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.plan li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.plan .n{font-family:var(--display);color:var(--brass)}
.plan .m{color:var(--muted);font-size:13px}
.notice{background:var(--worry-soft);border-radius:10px;padding:10px 12px;font-size:14px}

/* Breath */
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.orb{width:150px;height:150px;border-radius:50%;background:var(--green-soft);border:1px solid var(--green);display:grid;place-items:center;transform:scale(.62);transition:transform 4s ease-in-out}
.orb.in{transform:scale(1)}
.orb.out{transform:scale(.62);transition-duration:6s}
.orb span{font-family:var(--display);color:var(--green);font-size:17px;transform:scale(1)}
.breath .count{color:var(--muted);font-size:13px}

/* Brain dump */
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;flex-direction:column;gap:7px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.item .txt{overflow-wrap:anywhere}
.item .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.tag[aria-pressed="true"][data-t="todo"]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.tag[aria-pressed="true"][data-t="worry"]{background:var(--worry-soft);border-color:var(--worry);color:var(--worry)}
.tag[aria-pressed="true"][data-t="letgo"]{background:var(--brass-soft);border-color:var(--brass);color:var(--brass)}
.item.letgo .txt{text-decoration:line-through;text-decoration-color:var(--brass);color:var(--muted)}
.del{border:0;background:transparent;color:var(--muted);font-size:12px;padding:3px 4px}
.since{font-size:11px;color:var(--worry);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px;border:1px dashed var(--line);border-radius:10px}
.tally{font-size:13px;color:var(--muted)}

/* Sit */
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green-soft);color:var(--green)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts .lb{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.timer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
.ring{width:190px;height:190px;max-width:100%;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .track{stroke:var(--line)}
.ring .prog{stroke:var(--brass);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring .left{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:36px}
.cue{font-family:var(--display);font-size:19px;text-align:center;min-height:3.2em;max-width:30ch;text-wrap:balance;transition:opacity .8s}
.cue.fade{opacity:0}

/* Close */
.figs{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.figs h3{font-family:var(--display);font-weight:400;font-size:17px;margin:0}
.figs .top3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.figs .top3 b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--green);font-variant-numeric:tabular-nums}
.figs .top3 span{font-size:12px;color:var(--muted)}
.figs ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.figs li{display:flex;justify-content:space-between;gap:12px}
.figs li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.figs li.up span:last-child{color:var(--green);font-weight:600}
.figs .lb{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sum{display:flex;flex-direction:column;gap:12px}
.sum h3{font-size:16px}
.copybox{display:flex;flex-direction:column;gap:8px}
.copybox textarea{font-size:13px;min-height:110px;background:var(--bg)}
.closed{text-align:center;padding:18px 0 6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.closed .big{font-family:var(--display);font-size:26px;color:var(--green)}

/* History */
.hist h2{font-size:18px}
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hlist li{border-bottom:1px solid var(--line)}
.hlist summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 0;cursor:pointer;align-items:baseline;list-style:none}
.hlist summary::-webkit-details-marker{display:none}
.hlist .d{font-weight:600}
.hlist .w{font-family:var(--display);color:var(--brass);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hlist .s{font-size:12px;color:var(--muted)}
.hlist .body{padding:0 0 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hlist .body b{font-weight:600}

#toast{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom, 0px));display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:.25s;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#toast.show{opacity:1;transform:none}
#toast div{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;max-width:480px}
#toast .who{font-family:var(--display);color:var(--brass);margin-right:8px}

@media (prefers-reduced-motion: reduce){
  .orb,.orb.out{transition:none}
  .ring .prog,.cue,#toast{transition:none}
}
@media (max-width:420px){ ol.steps .nm{font-size:9px} .opts{grid-template-columns:1fr} }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Sunday Shutdown</h1>
      <div class="sub" id="dateline">Ten minutes to close the weekend properly.</div>
    </div>
    <div class="clock"><div class="t num" id="clock">10:00</div><div class="lbl">minutes, roughly</div></div>
  </header>

  <ol class="steps" id="steps" aria-label="Steps"></ol>

  <main id="stage"></main>

  <section class="sheet hist" id="hist">
    <h2>Past shutdowns</h2>
    <p class="muted small" id="histEmpty">Your closed weekends will be listed here, with their theme and what you parked.</p>
    <ul class="hlist" id="hlist"></ul>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"><div></div></div>

<script type="module">
import { mountShell } from "./js/shell.js";
import { openDb } from "./js/compat-db.js";
import { openStore } from "./js/sync.js";
import { weekTally, liftsUp, mondayOf, addDays, fmtMins } from "./js/rooms.js";
mountShell('shutdown');
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const fmtLong = s => parse(s).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = s => parse(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const uid = () => Math.random().toString(36).slice(2,9);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastTimer;
const mins = secs => secs < 60 ? "under a minute" : Math.round(secs/60)+" min";
function say(text){ const t=$("#toast"); t.firstElementChild.innerHTML='<span class="who">Alfred</span>'+esc(text); t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3200); }

const STEPS = [
  {k:"arrive", n:"Arrive",  min:1},
  {k:"dump",   n:"Empty the head", short:"Empty", min:2},
  {k:"back",   n:"Look back", short:"Back", min:2},
  {k:"ahead",  n:"Look ahead", short:"Ahead", min:1},
  {k:"sit",    n:"Sit", min:4},
  {k:"close",  n:"Close", min:0}
];
const TAGS = [["todo","To-do"],["worry","Worry"],["letgo","Let go"]];

const CUES = [
  "Sit comfortably. Feet on the floor, hands wherever they like.",
  "Let your eyes close, or rest them on a spot on the floor.",
  "Notice the breath. No need to change it. Just notice it.",
  "Count each out-breath, one to ten. Then start again at one.",
  "If you lose count, that's fine. Begin again at one. That is the practice.",
  "Bring your attention to your feet. Then your legs, slowly upwards.",
  "Notice the shoulders. Let them drop a little.",
  "Thoughts about tomorrow will arrive. Let them pass like traffic outside.",
  "Notice the sounds in the room. The house, the street, the quiet.",
  "Widen your attention to the whole body, sitting here, breathing.",
  "Nothing needs doing in this minute.",
  "When the bell sounds, open your eyes slowly. No rush."
];

// ---------- State ----------
const fresh = () => ({ date: ymd(new Date()), step:-1, items:[], back:{well:"",drained:"",grateful:""}, ahead:{matters:"",word:"",note:""}, sit:{mode:"guided",len:5,secs:0}, parkedMerged:false, saved:false });
let D = fresh();
const DRAFT_KEY = "sunday-shutdown-draft";
try { const raw = localStorage.getItem(DRAFT_KEY); if (raw) { const d = JSON.parse(raw); const age = (new Date() - parse(d.date))/864e5; if (age < 2 && !d.saved) D = Object.assign(fresh(), d); } } catch(e){}
function keep(){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify(D)); } catch(e){} }

let history = [];       // past shutdowns, newest first
let parked = [];        // worries parked last time
let db = null;
const LOCAL_HIST = "sunday-shutdown-history", LOCAL_PARK = "sunday-shutdown-parked";
function localGet(k, dflt){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : dflt; } catch(e){ return dflt; } }
function localSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

// ---------- The week in figures (from the Ledger, the Training Room and the Focus Room) ----------
const ledgerStore = openStore("ledger"), trainingStore = openStore("training"), focusStore = openStore("focus");
/** The week being closed: Monday to the shutdown's date, or last week when it's done on a Monday. */
function weekRange(){
  const day = parse(D.date).getDay();
  if (day === 1) { const from = addDays(D.date, -7); return { from, to: addDays(from, 6) }; }
  return { from: mondayOf(D.date), to: D.date };
}
function figures(){
  const { from, to } = weekRange();
  const T = weekTally(ledgerStore, from, to);
  const lifts = liftsUp(trainingStore, from, to);
  const t0 = parse(from).getTime(), t1 = parse(addDays(to, 1)).getTime();
  const focus = focusStore.list("log/").map(x=>x.value).filter(e => e.k === "focus" && e.t >= t0 && e.t < t1);
  const focusMins = focus.reduce((a,e)=>a+(e.m||0),0);
  const writeMins = focus.filter(e => e.label === "Writing").reduce((a,e)=>a+(e.m||0),0);
  return { from, to, T, lifts, focusMins, writeMins };
}
function figuresHtml(F, compact){
  if (!F.T.rows.length && !F.lifts.length && !F.focusMins) return "";
  const kept = F.T.rows.filter(r => !r.weekly), done = kept.reduce((a,r)=>a+Math.min(r.n,r.of),0), of = kept.reduce((a,r)=>a+r.of,0);
  const pct = of ? Math.round(done/of*100) : 0;
  return `<div class="figs">
    <h3>The week in figures · ${esc(fmtShort(F.from))} to ${esc(fmtShort(F.to))}</h3>
    <div class="top3"><div><b>${pct}%</b><span>of daily habits kept</span></div><div><b>${F.focusMins ? esc(fmtMins(F.focusMins)) : "0"}</b><span>in the Focus Room</span></div><div><b>${F.lifts.length}</b><span>${F.lifts.length===1?"lift":"lifts"} went up</span></div></div>
    ${compact ? "" : `<span class="lb">Habits</span><ul>${F.T.rows.map(r=>`<li><span>${esc(r.name)}</span><span>${r.n} of ${r.of}${r.weekly?" (target)":""}</span></li>`).join("")}
      ${F.T.workoutMix.length ? `<li><span>Workout mix</span><span>${F.T.workoutMix.map(m=>`${esc(m.label)} ${m.n}/${m.target}`).join(" · ")}</span></li>` : ""}
      ${F.writeMins ? `<li><span>Writing in the Focus Room</span><span>${esc(fmtMins(F.writeMins))}</span></li>` : ""}
      ${F.T.rest ? `<li><span>Rest days</span><span>${F.T.rest}</span></li>` : ""}</ul>`}
    ${F.lifts.length ? `<span class="lb">Lifts that went up</span><ul>${F.lifts.slice(0, compact?3:8).map(l=>`<li class="up"><span>${esc(l.move)} <span class="muted small">${esc(l.tier)}</span></span><span>${l.from} → ${l.to} lb</span></li>`).join("")}</ul>` : ""}
  </div>`;
}
function figuresText(F){
  const L = [`The week (${fmtShort(F.from)} to ${fmtShort(F.to)}):`];
  F.T.rows.forEach(r => L.push(`- ${r.name}: ${r.n} of ${r.of}${r.weekly?" (target)":""}`));
  if (F.T.workoutMix.length) L.push(`- Workout mix: ${F.T.workoutMix.map(m=>`${m.label} ${m.n}/${m.target}`).join(", ")}`);
  if (F.focusMins) L.push(`- Focus Room: ${fmtMins(F.focusMins)}${F.writeMins?`, of which writing ${fmtMins(F.writeMins)}`:""}`);
  if (F.lifts.length) L.push(`- Lifts up: ${F.lifts.map(l=>`${l.move} (${l.tier}) ${l.from} to ${l.to} lb`).join("; ")}`);
  return F.T.rows.length || F.lifts.length || F.focusMins ? L.join("\n") : "";
}

// ---------- Rendering ----------
function renderSteps(){
  $("#steps").innerHTML = STEPS.map((s,i) => `<li class="${i<D.step?'done':''} ${i===D.step?'on':''}"><span class="bar"></span><span class="nm">${esc(s.short||s.n)}</span></li>`).join("");
  const left = STEPS.slice(Math.max(D.step,0)).reduce((a,s)=>a+(s.k==="sit"?D.sit.len:s.min),0);
  $("#clock").textContent = Math.max(left,0)+":00";
  $("#dateline").textContent = fmtLong(D.date) + (D.step<0 ? ". Ten minutes to close the weekend properly." : "");
}
function nav(back, next, nextLabel="Next"){
  return `<div class="nav">${back?`<button class="btn ghost" data-go="${D.step-1}">Back</button>`:'<span></span>'}<button class="btn primary" data-go="${D.step+1}">${esc(nextLabel)}</button></div>`;
}
function render(){
  renderSteps();
  stopBreath();
  const st = $("#stage");
  const s = D.step;
  if (s < 0) st.innerHTML = viewIntro();
  else st.innerHTML = [viewArrive, viewDump, viewBack, viewAhead, viewSit, viewClose][s]();
  if (s === 1) { const i = $("#newItem"); i && !matchMedia("(hover:none)").matches && i.focus(); }
  keep();
}

function viewIntro(){
  const last = history[0];
  const doneToday = last && last.date === D.date;
  return `<section class="sheet">
    <div class="eyebrow">Sunday evening</div>
    <h2>Put the weekend away.</h2>
    ${figuresHtml(figures(), false)}
    <p class="lede">Six short steps. Empty your head, look back, look ahead, sit for a few minutes, and close. I'll take the notes.</p>
    <ul class="plan">
      ${STEPS.map((x,i)=>`<li><span class="n">${i+1}</span><span>${esc(x.n)}</span><span class="m num">${x.k==="sit"?"3–10 min":x.min?x.min+" min":"done"}</span></li>`).join("")}
    </ul>
    ${parked.length ? `<p class="notice">You parked ${parked.length} ${parked.length===1?"worry":"worries"} last time. We'll look at ${parked.length===1?"it":"them"} again in step 2.</p>` : ""}
    ${doneToday ? `<p class="notice">You've already closed today. Going again will replace that entry.</p>` : ""}
    <p class="alfred">Phone face down, if you'd be so kind. The week will still be there in ten minutes.</p>
    <div class="btns"><button class="btn primary" data-go="0">${D.items.length||D.back.well?'Carry on':'Begin'}</button>${D.items.length||D.back.well?'<button class="btn ghost" id="restart">Start over</button>':''}</div>
  </section>`;
}

function viewArrive(){
  return `<section class="sheet">
    <div class="eyebrow">Step 1 · Arrive</div>
    <h2>Three slow breaths.</h2>
    <p class="lede">In for four, out for six. Let the circle set the pace.</p>
    <div class="breath">
      <div class="orb" id="orb"><span id="orbTxt">Ready</span></div>
      <div class="count num" id="bcount">0 of 3</div>
      <button class="btn" id="breathe">Begin breathing</button>
    </div>
    ${nav(true,true)}
  </section>`;
}
let breathTimers = [];
function stopBreath(){ breathTimers.forEach(clearTimeout); breathTimers=[]; }
function startBreath(){
  stopBreath();
  const orb=$("#orb"), txt=$("#orbTxt"), cnt=$("#bcount"), b=$("#breathe");
  if (!orb) return;
  b.disabled = true;
  let t = 0;
  for (let i=0;i<3;i++){
    breathTimers.push(setTimeout(()=>{ orb.className="orb in"; txt.textContent="Breathe in"; cnt.textContent=(i+1)+" of 3"; }, t)); t+=4000;
    breathTimers.push(setTimeout(()=>{ orb.className="orb out"; txt.textContent="Breathe out"; }, t)); t+=6000;
  }
  breathTimers.push(setTimeout(()=>{ txt.textContent="Good"; b.disabled=false; b.textContent="Once more"; say("Better. Shall we empty the head?"); }, t));
}

function mergeParked(){
  if (D.parkedMerged) return;
  const have = new Set(D.items.map(i=>i.text.trim().toLowerCase()));
  parked.forEach(p => { if (!have.has(p.text.trim().toLowerCase())) D.items.unshift({id:uid(), text:p.text, tag:"worry", since:p.since||null}); });
  D.parkedMerged = true;
}
function viewDump(){
  mergeParked();
  const c = t => D.items.filter(i=>i.tag===t).length;
  return `<section class="sheet">
    <div class="eyebrow">Step 2 · Empty the head</div>
    <h2>What's rattling about?</h2>
    <p class="lede">One line each. Errands, worries, ideas, the thing you keep remembering at 11 pm. Tag each one as you go.</p>
    <form class="add" id="addForm"><input type="text" id="newItem" placeholder="e.g. book the car in for its service" autocomplete="off" aria-label="Something on your mind"><button class="btn" type="submit">Add</button></form>
    ${D.items.length ? `<ul class="items">${D.items.map(itemRow).join("")}</ul>
      <p class="tally num">${c("todo")} to-do · ${c("worry")} parked · ${c("letgo")} let go</p>`
      : `<p class="empty">Nothing yet. Even "nothing on my mind" is worth a line.</p>`}
    <p class="alfred small">Worries get parked until next Sunday, so you needn't carry them in the meantime.</p>
    ${nav(true,true)}
  </section>`;
}
function itemRow(i){
  return `<li class="item ${i.tag}" data-id="${i.id}">
    ${i.since?`<span class="since">Parked since ${esc(fmtShort(i.since))}</span>`:""}
    <span class="txt">${esc(i.text)}</span>
    <span class="meta"><span class="tags">${TAGS.map(([k,l])=>`<button class="tag" data-t="${k}" aria-pressed="${i.tag===k}">${l}</button>`).join("")}</span><button class="del" data-del="${i.id}" aria-label="Remove">Remove</button></span>
  </li>`;
}

function viewBack(){
  const f = (k,l,h) => `<label class="f">${l}<span class="hint">${h}</span><textarea id="back-${k}" data-bind="back.${k}" rows="2">${esc(D.back[k])}</textarea></label>`;
  return `<section class="sheet">
    <div class="eyebrow">Step 3 · Look back</div>
    <h2>How was the week, really?</h2>
    ${figuresHtml(figures(), true)}
    ${f("well","What went well?","Small counts. A good walk, a paragraph, a decent sleep.")}
    ${f("drained","What drained you?","Name it so we can plan around it.")}
    ${f("grateful","One thing you're grateful for","Someone, something, a moment.")}
    ${nav(true,true)}
  </section>`;
}

function viewAhead(){
  return `<section class="sheet">
    <div class="eyebrow">Step 4 · Look ahead</div>
    <h2>The week to come.</h2>
    <label class="f">What matters most next week?<span class="hint">One or two things. The rest is detail.</span><textarea id="ahead-matters" data-bind="ahead.matters" rows="2">${esc(D.ahead.matters)}</textarea></label>
    <label class="f">One word for the week<span class="hint">Steady. Gentle. Finish. Whatever fits.</span><input type="text" id="ahead-word" data-bind="ahead.word" maxlength="24" value="${esc(D.ahead.word)}"></label>
    <label class="f">Anything Alfred should know for the plan?<span class="hint">Energy, plans with family or friends, a day you'd like kept light. Personal things only.</span><textarea id="ahead-note" data-bind="ahead.note" rows="2">${esc(D.ahead.note)}</textarea></label>
    ${nav(true,true)}
  </section>`;
}

// ---------- Meditation ----------
const M = { running:false, start:0, elapsed:0, timer:null, cueIdx:-1, lock:null, finished:false };
function viewSit(){
  const len = D.sit.len, total = len*60;
  const left = Math.max(total - Math.round(M.elapsed/1000), 0);
  const C = 2*Math.PI*88;
  const frac = Math.min(M.elapsed/1000/total, 1);
  return `<section class="sheet">
    <div class="eyebrow">Step 5 · Sit</div>
    <h2>${M.finished ? "Well sat." : "A few quiet minutes."}</h2>
    ${!M.running && !M.finished ? `
    <div class="opts">
      <div><div class="lb">Style</div><div class="seg" role="group" aria-label="Style">
        <button data-mode="guided" aria-pressed="${D.sit.mode==="guided"}">Guided</button><button data-mode="silent" aria-pressed="${D.sit.mode==="silent"}">Silent</button></div></div>
      <div><div class="lb">Length</div><div class="seg" role="group" aria-label="Length">
        ${[3,5,10].map(n=>`<button data-len="${n}" aria-pressed="${len===n}">${n} min</button>`).join("")}</div></div>
    </div>
    <p class="lede small">${D.sit.mode==="guided"?"Gentle prompts appear every so often. Glance at them or don't.":"Just a bell to begin and a bell to end."} Sound on, if you can.</p>` : ""}
    <div class="timer">
      <div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="88"></circle><circle class="prog" id="prog" cx="100" cy="100" r="88" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"></circle></svg>
        <div class="left num" id="left">${Math.floor(left/60)}:${pad(left%60)}</div></div>
      <p class="cue" id="cue">${M.finished ? "Take a moment before moving on." : M.running ? (D.sit.mode==="guided" && M.cueIdx>=0 ? esc(CUES[M.cueIdx]) : "") : (D.sit.mode==="guided"?"Press begin, settle, and follow along.":"Press begin. The bell will tell you when.")}</p>
      <div class="btns">
        ${M.finished ? "" : M.running ? `<button class="btn" id="medPause">Pause</button><button class="btn ghost" id="medEnd">End here</button>` : `<button class="btn primary" id="medStart">${M.elapsed?"Resume":"Begin"}</button>`}
      </div>
    </div>
    <div class="nav"><button class="btn ghost" data-go="${D.step-1}">Back</button><button class="btn ${M.finished?'primary':''}" data-go="${D.step+1}">${M.finished?"Next":"Skip tonight"}</button></div>
  </section>`;
}
let actx = null;
function bell(){
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime, out = actx.createGain(); out.gain.value = .22; out.connect(actx.destination);
    [[523.25,1,4.5],[1046.5,.45,3],[1569,.2,2],[787,.18,3.5]].forEach(([f,a,d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+d+.1);
    });
  } catch(e){}
}
async function wake(on){
  try {
    if (on && "wakeLock" in navigator) M.lock = await navigator.wakeLock.request("screen");
    else if (!on && M.lock) { await M.lock.release(); M.lock = null; }
  } catch(e){}
}
function cueFor(sec){
  const total = D.sit.len*60;
  if (sec >= total - 30) return CUES.length-1;
  // Spread the middle cues evenly; fewer in short sits
  const mid = CUES.length-1;
  return Math.min(Math.floor(sec / ((total-30)/mid)), mid-1);
}
function tick(){
  const total = D.sit.len*60*1000;
  const el = M.elapsed + (performance.now() - M.start);
  const sec = Math.floor(el/1000);
  const left = Math.max(Math.ceil((total-el)/1000),0);
  const C = 2*Math.PI*88;
  const lp = $("#left"), pr = $("#prog"), cue = $("#cue");
  if (lp) lp.textContent = Math.floor(left/60)+":"+pad(left%60);
  if (pr) pr.setAttribute("stroke-dashoffset", C*(1-Math.min(el/total,1)));
  if (D.sit.mode==="guided" && cue){
    const ci = cueFor(sec);
    if (ci !== M.cueIdx){ M.cueIdx = ci; if (reduced) cue.textContent = CUES[ci]; else { cue.classList.add("fade"); setTimeout(()=>{ cue.textContent = CUES[ci]; cue.classList.remove("fade"); }, 700); } }
  }
  if (el >= total) finishMed(total);
}
function startMed(){
  if (!M.elapsed) bell();
  M.running = true; M.start = performance.now();
  clearInterval(M.timer); M.timer = setInterval(tick, 500);
  wake(true); render(); tick();
}
function pauseMed(){
  M.elapsed += performance.now() - M.start; M.running = false; clearInterval(M.timer); wake(false); render();
}
function finishMed(ms){
  const el = ms ?? (M.elapsed + (M.running ? performance.now()-M.start : 0));
  clearInterval(M.timer); M.running = false; M.finished = true; M.elapsed = el;
  D.sit.secs = Math.round(el/1000);
  bell(); wake(false); render();
  say(D.sit.secs >= 60 ? `${Math.round(D.sit.secs/60)} minutes. Remember to tick meditation in the ledger.` : "Short, but it counts.");
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && M.running) { wake(true); tick(); } });

// ---------- Close ----------
const todos = () => D.items.filter(i=>i.tag==="todo").map(i=>i.text.trim()).filter(Boolean);
const worries = () => D.items.filter(i=>i.tag==="worry");
function todoText(){ return todos().join("\n"); }
function alfredText(){
  const L = [`SUNDAY SHUTDOWN: ${fmtLong(D.date)}`];
  if (D.ahead.word) L.push(`Word for the week: ${D.ahead.word}`);
  if (D.ahead.matters) L.push(`What matters most: ${D.ahead.matters}`);
  if (D.ahead.note) L.push(`For the plan: ${D.ahead.note}`);
  if (D.back.well) L.push(`Went well: ${D.back.well}`);
  if (D.back.drained) L.push(`Drained me: ${D.back.drained}`);
  if (D.back.grateful) L.push(`Grateful for: ${D.back.grateful}`);
  if (todos().length) L.push(`To-dos to file in Tasks:\n` + todos().map(t=>"- "+t).join("\n"));
  if (worries().length) L.push(`Parked worries: ${worries().map(w=>w.text).join("; ")}`);
  L.push(`Sat for: ${D.sit.secs ? mins(D.sit.secs)+" ("+D.sit.mode+")" : "skipped"}`);
  const ft = figuresText(figures()); if (ft) L.push(ft);
  return L.join("\n");
}
function viewClose(){
  if (D.saved) return `<section class="sheet"><div class="closed">
      <div class="eyebrow">Step 6 · Close</div>
      <div class="big">The weekend is closed.</div>
      <p class="muted">${D.ahead.word ? `This week's word is <b>${esc(D.ahead.word)}</b>. ` : ""}Go and do nothing in particular.</p>
    </div>
    ${copyBlocks()}
    <div class="btns"><button class="btn ghost" id="restart">Start a new shutdown</button></div></section>`;
  const lg = D.items.filter(i=>i.tag==="letgo").length;
  return `<section class="sheet">
    <div class="eyebrow">Step 6 · Close</div>
    <h2>Here's what you're leaving behind.</h2>
    <div class="sum">
      <p class="num">${todos().length} to-do${todos().length===1?"":"s"} to file · ${worries().length} worr${worries().length===1?"y":"ies"} parked until next Sunday · ${lg} let go · ${D.sit.secs?mins(D.sit.secs)+" sat":"no sit tonight"}</p>
      ${D.ahead.word ? `<p>Word for the week: <b>${esc(D.ahead.word)}</b></p>` : ""}
    </div>
    ${copyBlocks()}
    <div class="nav"><button class="btn ghost" data-go="${D.step-1}">Back</button><button class="btn primary" id="closeIt">Close the weekend</button></div>
  </section>`;
}
function copyBlocks(){
  return `${todos().length?`<div class="copybox"><h3>To-dos for Notion Tasks</h3><textarea id="cpTodo" readonly>${esc(todoText())}</textarea><div class="btns"><button class="btn" data-copy="cpTodo">Copy to-dos</button></div></div>`:""}
    <div class="copybox"><h3>Note for Alfred's Sunday plan</h3><textarea id="cpAlfred" readonly>${esc(alfredText())}</textarea><div class="btns"><button class="btn" data-copy="cpAlfred">Copy note</button><span class="muted small">Paste it to me and I'll file the to-dos and plan around it.</span></div></div>`;
}

// ---------- Saving ----------
const queues = {};
function write(path, fn){ queues[path] = (queues[path]||Promise.resolve()).then(fn).catch(e => say(e && e.code==="quota_exceeded" ? "Storage is full. Old entries need clearing." : "That didn't save. Check your connection and try again.")); return queues[path]; }
function record(){
  return { date:D.date, word:D.ahead.word.trim(), matters:D.ahead.matters.trim(), note:D.ahead.note.trim(),
    well:D.back.well.trim(), drained:D.back.drained.trim(), grateful:D.back.grateful.trim(),
    todos:todos(), worries:worries().map(w=>w.text.trim()), letgo:D.items.filter(i=>i.tag==="letgo").length,
    sitMode:D.sit.mode, sitSecs:D.sit.secs, savedAt:new Date().toISOString(), figures:figuresSaved() };
}
function figuresSaved(){
  const F = figures();
  return { from:F.from, to:F.to, habits:F.T.rows.map(r=>({ id:r.id, name:r.name, n:r.n, of:r.of })), mix:F.T.workoutMix, focusMins:F.focusMins, writeMins:F.writeMins, lifts:F.lifts };
}
async function closeWeekend(){
  const rec = record();
  const park = { items: worries().map(w=>({ text:w.text.trim(), since:w.since||D.date })), updatedAt:rec.savedAt };
  if (db) {
    await write("shutdowns/"+D.date, () => db.collection("shutdowns").doc(D.date).set(rec));
    await write("parked/current", () => db.doc("parked/current").set(park));
  } else {
    const h = localGet(LOCAL_HIST, []).filter(x=>x.date!==D.date); h.unshift(rec); localSet(LOCAL_HIST, h.slice(0,52)); localSet(LOCAL_PARK, park);
    history = h; parked = park.items; renderHistory();
  }
  D.saved = true; keep(); render();
  say("Closed. I'll see you on the other side of the week.");
}

function renderHistory(){
  const ul = $("#hlist");
  $("#histEmpty").hidden = history.length > 0;
  ul.innerHTML = history.slice(0,12).map(h => `<li><details><summary><span class="d">${esc(fmtShort(h.date))}</span><span class="w">${esc(h.word||"")}</span><span class="s num">${(h.todos||[]).length} to-do · ${h.sitSecs?mins(h.sitSecs)+" sat":"no sit"}</span></summary>
    <div class="body">
      ${h.matters?`<p><b>Mattered most:</b> ${esc(h.matters)}</p>`:""}
      ${h.well?`<p><b>Went well:</b> ${esc(h.well)}</p>`:""}
      ${h.drained?`<p><b>Drained:</b> ${esc(h.drained)}</p>`:""}
      ${h.grateful?`<p><b>Grateful for:</b> ${esc(h.grateful)}</p>`:""}
      ${(h.worries||[]).length?`<p><b>Parked:</b> ${esc(h.worries.join("; "))}</p>`:""}
      ${(h.todos||[]).length?`<p><b>To-dos:</b> ${esc(h.todos.join("; "))}</p>`:""}
    </div></details></li>`).join("");
}

// ---------- Events ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.go !== undefined) {
    const to = Number(t.dataset.go);
    if (M.running) pauseMed();
    D.step = Math.max(-1, Math.min(to, STEPS.length-1));
    render(); window.scrollTo({top:0, behavior: reduced?"auto":"smooth"}); return;
  }
  if (t.id === "breathe") return startBreath();
  if (t.id === "restart") { clearInterval(M.timer); Object.assign(M,{running:false,elapsed:0,finished:false,cueIdx:-1}); D = fresh(); render(); return; }
  if (t.classList.contains("tag")) { const id = t.closest(".item").dataset.id; const it = D.items.find(i=>i.id===id); if (it) { it.tag = t.dataset.t; render(); } return; }
  if (t.dataset.del) { D.items = D.items.filter(i=>i.id!==t.dataset.del); render(); return; }
  if (t.dataset.mode) { D.sit.mode = t.dataset.mode; render(); return; }
  if (t.dataset.len) { D.sit.len = Number(t.dataset.len); M.elapsed = 0; render(); return; }
  if (t.id === "medStart") return startMed();
  if (t.id === "medPause") return pauseMed();
  if (t.id === "medEnd") return finishMed();
  if (t.id === "closeIt") { t.disabled = true; return closeWeekend(); }
  if (t.dataset.copy) {
    const ta = document.getElementById(t.dataset.copy);
    try { await navigator.clipboard.writeText(ta.value); say("Copied."); }
    catch(err){ ta.focus(); ta.select(); say("Selected. Copy it with your usual shortcut."); }
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "addForm") return;
  e.preventDefault();
  const inp = $("#newItem"); const v = inp.value.trim(); if (!v) return;
  const worryish = /\b(worr|anxious|nervous|what if|afraid|stress)/i.test(v);
  D.items.push({ id:uid(), text:v, tag: worryish ? "worry" : "todo" });
  render(); const n = $("#newItem"); n && n.focus();
});
document.addEventListener("input", e => {
  const b = e.target.dataset && e.target.dataset.bind; if (!b) return;
  const [grp,key] = b.split("."); D[grp][key] = e.target.value; keep();
});

// ---------- Boot ----------
history = localGet(LOCAL_HIST, []); parked = (localGet(LOCAL_PARK, {items:[]}).items)||[];
render(); renderHistory();
[ledgerStore, trainingStore, focusStore].forEach(st => st.subscribe(() => { if (D.step < 0) render(); }));
(async () => {
  db = openDb("shutdown");
  if (!db) return;
  db.collection("shutdowns").orderBy("date","desc").limit(24).onSnapshot(snap => {
    history = snap.docs.map(d=>d.data()).filter(Boolean); renderHistory(); if (D.step<0) render();
  }, () => {});
  db.doc("parked/current").onSnapshot(snap => {
    parked = (snap.exists && snap.data().items) || []; if (D.step<0) render();
  }, () => {});
})();
})();
</script>
