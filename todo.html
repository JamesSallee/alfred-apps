<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="js/vendor/supabase-2.45.4.js"></script>
<title>The Errand Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* One column of lists (Today, This week, Later, Someday) with a capture box on top; on the laptop the
   side column holds the filters, snoozed and waiting items, and the done shelf. Same family as the Study. */
:root{
  --bg:#eef1ec; --paper:#f8faf6; --ink:#1d2b24; --muted:#5d6b63; --line:#d3dbd4;
  --green:#1f4d3a; --green-soft:#dce8e0; --brass:#a87a1f; --brass-soft:#f3e7c8;
  --rust:#a4472f; --rust-soft:#f6e1d9; --on-green:#f4f7f2;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a16; --paper:#18241f; --ink:#e6ece7; --muted:#9aa9a0; --line:#2b3a33;
  --green:#7fbf9d; --green-soft:#21352c; --brass:#d9ad55; --brass-soft:#3a3020;
  --rust:#e58f75; --rust-soft:#3d2620; --on-green:#10201a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a16; --paper:#18241f; --ink:#e6ece7; --muted:#9aa9a0; --line:#2b3a33;
  --green:#7fbf9d; --green-soft:#21352c; --brass:#d9ad55; --brass-soft:#3a3020;
  --rust:#e58f75; --rust-soft:#3d2620; --on-green:#10201a; color-scheme:dark}
html,body{background:var(--bg)}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:is(button,a,input,select,textarea):focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow,.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header .t{display:flex;flex-direction:column;gap:4px}
h1{font-size:30px;line-height:1.1}
.back{color:var(--green);font-weight:600;text-decoration:none;font-size:14px}
.greet{color:var(--muted)}

.book{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
/* One column on phones and portrait tablets, kept to a readable width. */
@media (max-width:820px){ .wrap{max-width:680px} .book{grid-template-columns:minmax(0,1fr)} .col{display:contents} #capture{order:-2} #filters{order:-1} }

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:19px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--green);background:transparent;color:var(--green);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.solid{background:var(--green);color:var(--on-green)}
.btn.brass{border-color:var(--brass);color:var(--brass)}
.btn.quiet{border-color:var(--line);color:var(--muted)}
.btn.danger{border-color:var(--rust);color:var(--rust)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.muted{color:var(--muted);font-size:13px}
.empty{font-size:13.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* Capture */
.cap{display:flex;gap:8px}
.cap input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 12px;font-size:15px}
.saved{font-size:13px;color:var(--green);min-height:1.2em}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}

/* Task lists */
.group{display:flex;flex-direction:column;gap:6px}
.group h2{font-size:19px;display:flex;gap:8px;align-items:baseline}
.group h2 .n{font-family:var(--body);font-size:13px;color:var(--muted)}
.tasks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:18px 22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line);background:var(--paper)}
.tasks .task:first-child{border-top:0}
.task.dragging{opacity:.55}
.task.over{box-shadow:0 -2px 0 var(--brass)}
.grip{cursor:grab;touch-action:none;color:var(--muted);border:0;background:none;padding:2px 0;line-height:1;font-size:14px;user-select:none}
.tick{appearance:none;width:20px;height:20px;border:1.6px solid var(--green);border-radius:6px;margin:1px 0 0;display:grid;place-items:center;cursor:pointer;background:transparent}
.tick:checked{background:var(--green)}
.tick:checked::after{content:"";width:9px;height:5px;border:2px solid var(--on-green);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.body{min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.title{font-size:15px;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tag{border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;letter-spacing:.02em;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.high{background:var(--rust-soft);color:var(--rust)}
.tag.late{background:var(--rust);color:var(--paper)}
.tag.booked{background:var(--green-soft);color:var(--green)}
.tag.slot{background:var(--brass-soft);color:var(--brass)}
.tag.new{border:1px dashed var(--brass);background:transparent;color:var(--brass)}
.tag.wait{background:var(--brass-soft);color:var(--brass)}
.acts{display:flex;gap:6px;align-items:center}
.pri{width:10px;height:10px;border-radius:50%;border:0;padding:0;margin-top:6px;background:var(--line)}
.pri.High{background:var(--rust)} .pri.Normal{background:var(--green)} .pri.Low{background:var(--line)}
.ask{display:flex;flex-direction:column;gap:6px;background:var(--brass-soft);border-radius:10px;padding:8px 10px;font-size:13.5px;grid-column:3 / -1}
.ask .who{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--brass)}

/* Side lists */
.mini{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.mini li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.mini li:first-child{border-top:0}
.mini .sub{display:block;font-size:12px;color:var(--muted)}
.mini s{color:var(--muted)}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.stat b.rust{color:var(--rust)}
.stat span{font-size:12px;color:var(--muted)}

/* Menus and sheets */
.menu{position:fixed;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;min-width:190px}
.menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--bg)}
.menu .sep{border-top:1px solid var(--line);margin:4px 0}
dialog{border:0;padding:0;background:transparent;max-width:min(480px,calc(100% - 24px));width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow:auto}
.sheet h2{font-size:20px}
.f{display:flex;flex-direction:column;gap:4px}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;font-size:14px;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{accent-color:var(--green)}
.bookedbox{background:var(--green-soft);border-radius:10px;padding:8px 10px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sheet .foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 14px;font-size:14px;display:flex;gap:12px;align-items:center;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:var(--brass-soft);font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="t">
      <a class="back" href="./">← Alfred's Study</a>
      <span class="eyebrow" id="date"></span>
      <h1>The Errand Book</h1>
    </div>
    <span class="greet" id="greet"></span>
  </header>

  <div class="book">
    <div class="col">
      <article class="card" id="capture" aria-labelledby="caph">
        <h2 id="caph">Something needs doing</h2>
        <form class="cap" id="capForm">
          <label class="label" for="capText" hidden>The task</label>
          <input id="capText" autocomplete="off" placeholder="Clear the gutters, renew the registration…">
          <button class="btn solid" type="submit">Add</button>
        </form>
        <span class="saved" id="capSaved" aria-live="polite">Or just tell Alfred in chat; he'll suggest a time.</span>
      </article>

      <div id="groups" class="col"></div>
    </div>

    <div class="col">
      <article class="card" id="filters" aria-labelledby="fh">
        <div class="head"><h2 id="fh">At a glance</h2></div>
        <div class="stat" id="stats"></div>
        <div class="chips" role="group" aria-label="Show one area" id="areaFilter"></div>
      </article>

      <article class="card" aria-labelledby="wh" id="waitCard">
        <div class="head"><h2 id="wh">Waiting on</h2><span class="eyebrow" id="waitN"></span></div>
        <ul class="mini" id="waiting"></ul>
      </article>

      <article class="card" aria-labelledby="sh" id="snoozeCard">
        <div class="head"><h2 id="sh">Snoozed</h2><span class="eyebrow" id="snoozeN"></span></div>
        <ul class="mini" id="snoozed"></ul>
      </article>

      <article class="card" aria-labelledby="dh">
        <div class="head"><h2 id="dh">Done</h2><span class="eyebrow">Last 30 days</span></div>
        <ul class="mini" id="done"></ul>
      </article>

      <p class="muted" id="mirrorNote">A copy goes to Notion Tasks as you go. Edit here; Notion is the spare.</p>
    </div>
  </div>
</div>

<dialog id="editor" aria-labelledby="edh">
  <form class="sheet" method="dialog" id="edForm">
    <h2 id="edh">The task</h2>
    <div class="f"><label class="label" for="edTitle">What needs doing</label><input id="edTitle" required></div>
    <div class="grid2">
      <div class="f"><label class="label" for="edArea">Area</label><input id="edArea" list="areaList" placeholder="Home"><datalist id="areaList"></datalist></div>
      <div class="f"><label class="label" for="edPri">Priority</label>
        <select id="edPri"><option>High</option><option selected>Normal</option><option>Low</option></select></div>
      <div class="f"><label class="label" for="edDue">Due</label><input id="edDue" type="date"></div>
      <div class="f"><label class="label" for="edSize">Roughly how long</label>
        <select id="edSize"><option value="">Not sure</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hour</option><option value="120">2 hours</option><option value="240">Half a day</option><option value="480">A whole day</option></select></div>
      <div class="f"><label class="label" for="edStatus">Status</label>
        <select id="edStatus"><option value="todo">To do</option><option value="doing">Doing</option><option value="waiting">Waiting on…</option><option value="done">Done</option></select></div>
      <div class="f" id="edWaitF"><label class="label" for="edWait">Waiting on</label><input id="edWait" placeholder="The electrician's quote"></div>
    </div>
    <div class="bookedbox" id="edBooked" hidden><span id="edBookedTxt"></span><button class="link" type="button" id="edUnbook">Clear</button></div>
    <label class="check"><input type="checkbox" id="edSlot"> Ask Alfred to find a slot</label>
    <label class="check"><input type="checkbox" id="edSomeday"> Someday, not now</label>
    <div class="f"><label class="label" for="edNotes">Notes</label><textarea id="edNotes" placeholder="What to bring, who to ring"></textarea></div>
    <div class="foot">
      <button class="btn danger" type="button" id="edDelete">Delete</button>
      <div class="row"><button class="btn quiet" type="button" id="edCancel">Cancel</button><button class="btn solid" type="submit">Save</button></div>
    </div>
  </form>
</dialog>

<dialog id="dateDlg" aria-labelledby="ddh">
  <form class="sheet" method="dialog" id="dateForm">
    <h2 id="ddh">Snooze until</h2>
    <div class="f"><label class="label" for="dateIn">Date</label><input id="dateIn" type="date" required></div>
    <div class="foot"><span></span><div class="row"><button class="btn quiet" type="button" id="dateCancel">Cancel</button><button class="btn solid" type="submit">Snooze</button></div></div>
  </form>
</dialog>

<script type="module">
import { mountShell } from "./js/shell.js";
import { openStore } from "./js/sync.js";
import { todoTasks, todoBucket, ymd, addDays, mirrorSoon as nudge } from "./js/rooms.js";
mountShell("todo");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

// ---------- Data ----------
// Store "todo":
//   tasks/<id>  { title, area, priority: High|Normal|Low, status: todo|doing|waiting|done, due, size (minutes),
//                 someday, snoozeUntil, snoozes, waitingOn, notes, booked: { start, end } | null,
//                 wantsSlot, triage (captured here, not yet sized by Alfred), order, created, doneAt }
//   settings    { areas: [..] }
// Alfred adds tasks from chat and sets `booked` once a slot is on the calendar. A server function copies
// every change one way to Notion Tasks (see supabase/functions/alfred-notion).
const store = openStore("todo");
const AREAS = ["Home", "Car", "Errands", "Admin", "Family", "Finances", "Career", "Health"];
const PRI = { High: 0, Normal: 1, Low: 2 };
const GROUPS = [["today", "Today"], ["week", "This week"], ["later", "Later"], ["someday", "Someday"]];

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => ymd(new Date());
const parse = (s) => new Date(s + "T12:00");
const short = (s) => parse(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const areas = () => { const s = store.get("settings")?.areas; return Array.isArray(s) && s.length ? s : AREAS; };
const save = (t) => { const { id, ...v } = t; store.set("tasks/" + id, v); mirrorSoon(); };
const find = (id) => todoTasks(store).find((t) => t.id === id);
const sizeTxt = (m) => !m ? "" : m < 60 ? `${m} min` : m === 240 ? "half a day" : m >= 480 ? "a day" : `${m / 60} hr`;
function bookedTxt(b) {
  if (!b?.start) return "";
  const d = new Date(b.start);
  const day = ymd(d) === today() ? "today" : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  return `${day}, ${d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;
}

const mirrorSoon = () => nudge("todo");

// ---------- Header ----------
$("date").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });

// ---------- Render ----------
let areaFilter = "all";
function render() {
  const all = todoTasks(store);
  const t = today();
  const open = all.filter((x) => x.status !== "done");
  const shown = open.filter((x) => areaFilter === "all" || (x.area || "Other") === areaFilter);
  const live = shown.filter((x) => !(x.snoozeUntil > t) && x.status !== "waiting");

  // Greeting
  const late = open.filter((x) => x.due && x.due < t && !(x.snoozeUntil > t)).length;
  const todayN = open.filter((x) => todoBucket(x, t) === "today").length;
  const doneWeek = all.filter((x) => x.status === "done" && x.doneAt && ymd(new Date(x.doneAt)) >= addDays(t, -6)).length;
  $("greet").textContent = !open.length ? "Not a thing outstanding. Remarkable." :
    late ? `${late} overdue. Shall we deal with the oldest first?` :
    todayN ? `${todayN} for today. One at a time.` : "Nothing due today. The kettle can stay on.";

  // Stats
  const slots = open.filter((x) => x.wantsSlot && !x.booked).length;
  $("stats").innerHTML = `<div><b>${open.length}</b><span>open</span></div>`
    + `<div><b class="${late ? "rust" : ""}">${late}</b><span>overdue</span></div>`
    + `<div><b>${slots}</b><span>need a slot</span></div>`
    + `<div><b>${doneWeek}</b><span>done this week</span></div>`;

  // Area filter (only areas in use, plus All)
  const used = [...new Set(open.map((x) => x.area || "Other"))].sort((a, b) => areas().indexOf(a) - areas().indexOf(b));
  if (areaFilter !== "all" && !used.includes(areaFilter)) areaFilter = "all";
  $("areaFilter").innerHTML = ["all", ...used].map((a) => `<button class="chip" type="button" data-area="${esc(a)}" aria-pressed="${a === areaFilter}">${a === "all" ? "All" : esc(a)}</button>`).join("");
  $("areaList").innerHTML = areas().map((a) => `<option value="${esc(a)}">`).join("");

  // Groups
  const by = Object.fromEntries(GROUPS.map(([k]) => [k, []]));
  live.forEach((x) => by[todoBucket(x, t)].push(x));
  $("groups").innerHTML = GROUPS.map(([k, name]) => {
    const list = by[k].sort(sorter);
    if (!list.length && k !== "today") return "";
    return `<section class="card group" aria-labelledby="g-${k}">
      <h2 id="g-${k}">${name} <span class="n">${list.length || ""}</span></h2>
      ${list.length ? `<ul class="tasks" data-group="${k}">${list.map(row).join("")}</ul>`
        : `<p class="empty">${open.length ? "Nothing for today. A rare and pleasant state." : "Nothing on the list. Add something above, or tell Alfred."}</p>`}
    </section>`;
  }).join("");

  // Waiting
  const waiting = shown.filter((x) => x.status === "waiting").sort(sorter);
  $("waitCard").hidden = !waiting.length;
  $("waitN").textContent = waiting.length || "";
  $("waiting").innerHTML = waiting.map((x) => `<li><button class="body" type="button" data-edit="${x.id}"><span class="title">${esc(x.title)}</span>
    <span class="sub">${x.waitingOn ? "On " + esc(x.waitingOn) : "Waiting"}${x.due ? " · due " + short(x.due) : ""}</span></button>
    <button class="btn sm quiet" type="button" data-unwait="${x.id}">Back on</button></li>`).join("");

  // Snoozed
  const snoozed = shown.filter((x) => x.snoozeUntil > t && x.status !== "waiting").sort((a, b) => a.snoozeUntil.localeCompare(b.snoozeUntil));
  $("snoozeCard").hidden = !snoozed.length;
  $("snoozeN").textContent = snoozed.length || "";
  $("snoozed").innerHTML = snoozed.map((x) => `<li><button class="body" type="button" data-edit="${x.id}"><span class="title">${esc(x.title)}</span>
    <span class="sub">Back ${short(x.snoozeUntil)}${x.snoozes > 1 ? ` · snoozed ${x.snoozes} times` : ""}</span></button>
    <button class="btn sm quiet" type="button" data-wake="${x.id}">Wake</button></li>`).join("");

  // Done (30 days)
  const from = addDays(t, -30);
  const done = all.filter((x) => x.status === "done" && x.doneAt && ymd(new Date(x.doneAt)) >= from).sort((a, b) => b.doneAt.localeCompare(a.doneAt));
  $("done").innerHTML = done.length ? done.slice(0, 40).map((x) => `<li><span><s>${esc(x.title)}</s><span class="sub">${short(ymd(new Date(x.doneAt)))}${x.area ? " · " + esc(x.area) : ""}</span></span>
    <button class="btn sm quiet" type="button" data-undo="${x.id}">Undo</button></li>`).join("")
    : `<li><span class="muted">Nothing ticked off yet. It'll fill up.</span></li>`;
}

const sorter = (a, b) => (a.order ?? 1e15) - (b.order ?? 1e15) || PRI[a.priority || "Normal"] - PRI[b.priority || "Normal"]
  || (a.due || "9999").localeCompare(b.due || "9999") || (a.created || "").localeCompare(b.created || "");

function row(x) {
  const t = today();
  const tags = [];
  if (x.triage) tags.push(`<span class="tag new">new: Alfred will size it</span>`);
  if (x.area) tags.push(`<span class="tag">${esc(x.area)}</span>`);
  if (x.priority === "High") tags.push(`<span class="tag high">High</span>`);
  if (x.due) tags.push(x.due < t ? `<span class="tag late">due ${short(x.due)}</span>` : `<span class="tag">${x.due === t ? "due today" : "due " + short(x.due)}</span>`);
  if (x.booked?.start) tags.push(`<span class="tag booked">booked ${bookedTxt(x.booked)}</span>`);
  else if (x.wantsSlot) tags.push(`<span class="tag slot">slot requested</span>`);
  if (x.size) tags.push(`<span>${sizeTxt(x.size)}</span>`);
  if (x.status === "doing") tags.push(`<span class="tag booked">doing</span>`);
  // Asks: a booked time that's passed, or something snoozed three times.
  let ask = "";
  if (x.booked?.start && new Date(x.booked.end || x.booked.start) < new Date()) {
    ask = `<div class="ask"><span class="who">Alfred</span>The time we booked has been and gone. Done, or shall I find another?
      <span class="row"><button class="btn sm solid" type="button" data-done="${x.id}">Done</button><button class="btn sm brass" type="button" data-reslot="${x.id}">Find another</button></span></div>`;
  } else if ((x.snoozes || 0) >= 3) {
    ask = `<div class="ask"><span class="who">Alfred</span>Snoozed ${x.snoozes} times. Keep it, shrink it, or let it go?
      <span class="row"><button class="btn sm quiet" type="button" data-keep="${x.id}">Keep</button><button class="btn sm brass" type="button" data-edit="${x.id}">Shrink it</button><button class="btn sm danger" type="button" data-drop="${x.id}">Let it go</button></span></div>`;
  }
  return `<li class="task" data-id="${x.id}">
    <button class="grip" type="button" aria-label="Drag to reorder" title="Drag to reorder">⋮⋮</button>
    <input class="tick" type="checkbox" aria-label="Done: ${esc(x.title)}" data-tick="${x.id}">
    <button class="body" type="button" data-edit="${x.id}"><span class="title">${esc(x.title)}</span><span class="meta">${tags.join("")}</span></button>
    <span class="acts">
      <button class="pri ${esc(x.priority || "Normal")}" type="button" data-pri="${x.id}" aria-label="Priority ${esc(x.priority || "Normal")}: tap to change" title="Priority: ${esc(x.priority || "Normal")}"></button>
      <button class="btn sm quiet" type="button" data-menu="${x.id}" aria-label="More for ${esc(x.title)}">⋯</button>
    </span>
    ${ask}
  </li>`;
}

// ---------- Actions ----------
function toast(msg, undo) {
  document.querySelector(".toast")?.remove();
  const el = Object.assign(document.createElement("div"), { className: "toast", role: "status" });
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ""}`;
  if (undo) el.querySelector("button").onclick = () => { undo(); el.remove(); };
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}
function complete(id) {
  const x = find(id); if (!x) return;
  const before = { ...x };
  save({ ...x, status: "done", doneAt: new Date().toISOString(), wantsSlot: false });
  toast("Done. Well handled.", () => save(before));
}
function snooze(id, until) {
  const x = find(id); if (!x) return;
  const before = { ...x };
  save({ ...x, snoozeUntil: until, snoozes: (x.snoozes || 0) + 1 });
  toast(`Out of sight until ${short(until)}.`, () => save(before));
}
function nextDow(dow) { const d = new Date(); d.setDate(d.getDate() + (((dow - d.getDay()) + 7) % 7 || 7)); return ymd(d); }

document.addEventListener("click", (e) => {
  const b = e.target.closest("button,[data-tick]");
  if (!b) { closeMenu(); return; }
  const d = b.dataset;
  if (d.area) { areaFilter = d.area; render(); return; }
  if (d.edit) { openEditor(d.edit); return; }
  if (d.pri) { const x = find(d.pri); const next = { High: "Low", Normal: "High", Low: "Normal" }[x.priority || "Normal"]; save({ ...x, priority: next }); return; }
  if (d.menu) { openMenu(d.menu, b); return; }
  if (d.done) { complete(d.done); return; }
  if (d.reslot) { const x = find(d.reslot); save({ ...x, booked: null, wantsSlot: true }); toast("I'll find another slot when we next speak."); return; }
  if (d.keep) { const x = find(d.keep); save({ ...x, snoozes: 0 }); return; }
  if (d.drop) { const x = find(d.drop); const before = { ...x }; store.remove("tasks/" + x.id); mirrorSoon(); toast("Let go. No hard feelings.", () => save(before)); return; }
  if (d.unwait) { const x = find(d.unwait); save({ ...x, status: "todo" }); return; }
  if (d.wake) { const x = find(d.wake); save({ ...x, snoozeUntil: null }); return; }
  if (d.undo) { const x = find(d.undo); save({ ...x, status: "todo", doneAt: null }); return; }
});
document.addEventListener("change", (e) => { if (e.target.dataset?.tick) complete(e.target.dataset.tick); });

// Capture
$("capForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const title = $("capText").value.trim(); if (!title) return;
  const area = areaFilter !== "all" ? areaFilter : "";
  save({ id: newId(), title, area, priority: "Normal", status: "todo", triage: true, wantsSlot: true, created: new Date().toISOString() });
  $("capText").value = "";
  $("capSaved").textContent = "On the list. I'll size it and suggest a time when we next speak.";
});

// ---------- The ⋯ menu ----------
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
function openMenu(id, anchor) {
  closeMenu();
  const x = find(id); if (!x) return;
  const isSat = new Date().getDay() === 6;
  menuEl = Object.assign(document.createElement("div"), { className: "menu", role: "menu" });
  const items = [
    ["Snooze to tomorrow", () => snooze(id, addDays(today(), 1))],
    [isSat ? "Snooze to next weekend" : "Snooze to the weekend", () => snooze(id, nextDow(6))],
    ["Snooze to next week", () => snooze(id, nextDow(1))],
    ["Snooze until…", () => pickDate(id)],
    null,
    [x.wantsSlot ? "Cancel the slot request" : "Ask Alfred for a slot", () => save({ ...x, wantsSlot: !x.wantsSlot })],
    [x.status === "doing" ? "Not started after all" : "Mark as doing", () => save({ ...x, status: x.status === "doing" ? "todo" : "doing" })],
    ["Waiting on someone…", () => { openEditor(id); $("edStatus").value = "waiting"; syncWaitField(); $("edWait").focus(); }],
    [x.someday ? "Bring it back from Someday" : "Move to Someday", () => save({ ...x, someday: !x.someday })],
  ];
  items.forEach((it) => {
    if (!it) { menuEl.appendChild(Object.assign(document.createElement("div"), { className: "sep" })); return; }
    const btn = Object.assign(document.createElement("button"), { type: "button", textContent: it[0] });
    btn.setAttribute("role", "menuitem");
    btn.onclick = (ev) => { ev.stopPropagation(); closeMenu(); it[1](); };
    menuEl.appendChild(btn);
  });
  document.body.appendChild(menuEl);
  const r = anchor.getBoundingClientRect();
  const w = menuEl.offsetWidth, h = menuEl.offsetHeight;
  menuEl.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  menuEl.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";
  menuEl.querySelector("button").focus();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
addEventListener("scroll", closeMenu, { passive: true });

let dateFor = null;
function pickDate(id) { dateFor = id; $("dateIn").value = addDays(today(), 3); $("dateIn").min = addDays(today(), 1); $("dateDlg").showModal(); }
$("dateForm").addEventListener("submit", () => { if (dateFor && $("dateIn").value) snooze(dateFor, $("dateIn").value); dateFor = null; });
$("dateCancel").onclick = () => $("dateDlg").close();

// ---------- Editor ----------
let editing = null;
function syncWaitField() { $("edWaitF").hidden = $("edStatus").value !== "waiting"; }
$("edStatus").addEventListener("change", syncWaitField);
function openEditor(id) {
  const x = find(id); if (!x) return;
  editing = x;
  $("edTitle").value = x.title || "";
  $("edArea").value = x.area || "";
  $("edPri").value = x.priority || "Normal";
  $("edDue").value = x.due || "";
  if (x.size && !$("edSize").querySelector(`option[value="${x.size}"]`)) $("edSize").insertAdjacentHTML("beforeend", `<option value="${Number(x.size)}">${sizeTxt(x.size)}</option>`);
  $("edSize").value = x.size ? String(x.size) : "";
  $("edStatus").value = x.status || "todo";
  $("edWait").value = x.waitingOn || "";
  $("edSlot").checked = !!x.wantsSlot;
  $("edSomeday").checked = !!x.someday;
  $("edNotes").value = x.notes || "";
  $("edBooked").hidden = !x.booked?.start;
  $("edBookedTxt").textContent = x.booked?.start ? "Booked " + bookedTxt(x.booked) : "";
  syncWaitField();
  $("editor").showModal();
}
$("edUnbook").onclick = () => { if (editing) { editing = { ...editing, booked: null }; $("edBooked").hidden = true; } };
$("edForm").addEventListener("submit", () => {
  if (!editing) return;
  const status = $("edStatus").value;
  const size = $("edSize").value;
  save({ ...editing,
    title: $("edTitle").value.trim() || editing.title,
    area: $("edArea").value.trim(),
    priority: $("edPri").value,
    due: $("edDue").value || null,
    size: size ? Number(size) : null,
    status,
    waitingOn: status === "waiting" ? $("edWait").value.trim() : "",
    wantsSlot: $("edSlot").checked,
    someday: $("edSomeday").checked,
    notes: $("edNotes").value.trim(),
    doneAt: status === "done" ? (editing.doneAt || new Date().toISOString()) : null,
  });
  editing = null;
});
$("edCancel").onclick = () => { editing = null; $("editor").close(); };
$("edDelete").onclick = () => {
  if (!editing) return;
  const before = { ...editing };
  store.remove("tasks/" + editing.id); mirrorSoon();
  editing = null; $("editor").close();
  toast("Deleted.", () => save(before));
};

// ---------- Drag to reorder (within a group) ----------
// Pointer events so it works with a finger as well as a mouse; the order is saved as a number per task.
let drag = null;
document.addEventListener("pointerdown", (e) => {
  const grip = e.target.closest(".grip"); if (!grip) return;
  const li = grip.closest(".task"); const ul = li.parentElement;
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  drag = { li, ul, grip, over: null, pointerId: e.pointerId };
  li.classList.add("dragging");
});
document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const rows = [...drag.ul.children].filter((r) => r !== drag.li);
  let target = null;
  for (const r of rows) { const b = r.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { target = r; break; } }
  if (drag.over) drag.over.classList.remove("over");
  drag.over = target; if (target) target.classList.add("over");
  drag.end = !target;
});
function endDrag() {
  if (!drag) return;
  const { li, ul, over } = drag;
  li.classList.remove("dragging"); over?.classList.remove("over");
  const ids = [...ul.children].map((r) => r.dataset.id).filter((id) => id !== li.dataset.id);
  const at = over ? ids.indexOf(over.dataset.id) : ids.length;
  ids.splice(at, 0, li.dataset.id);
  drag = null;
  ids.forEach((id, i) => { const x = find(id); if (x && x.order !== (i + 1) * 10) save({ ...x, order: (i + 1) * 10 }); });
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", () => { if (drag) { drag.li.classList.remove("dragging"); drag.over?.classList.remove("over"); drag = null; } });

store.subscribe(() => { if (!drag) render(); });
</script>
